<li class="post-item">
  <div class="post-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y 年 %m 月 %d 日' }}</time></div>
  <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  <p>{{ post.excerpt | strip_html | strip_newlines | truncate: 160 }}</p>
  {% if post.tags %}<ul class="tags" aria-label="标签">{% for tag in post.tags %}<li><span class="tag">{{ tag }}</span></li>{% endfor %}</ul>{% endif %}
</li>
