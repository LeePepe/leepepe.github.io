<style>

<p>保留咖啡色系，换手写感字体，重新设计布局。三个布局都用同一篇真实文章（第 4 篇）。</p><a class="item" href="fonts.html"><b>字体样张</b><span>8 款手写感／温暖字体放在同一段真实内容上对比，标了授权和加载体积，前 3 款是推荐。</span></a><a class="item" href="layout-1.html"><b>布局一：杂志封面</b><span>系列有一张封面大图和手绘咖啡杯，文章是带章节大号码的卡片，适合当“一本小册子”。</span></a><a class="item" href="layout-2.html"><b>布局二：信笺</b><span>像一封写在格子纸上的信：手写称呼、目录虚线引导、顶部 8 个圆点的进度条、页边手写批注。</span></a><a class="item" href="layout-3.html"><b>布局三：双栏阅读</b><span>左边固定的系列目录和本篇小标题、阅读进度；右边正文。手机上目录收进顶部抽屉。</span></a></main></body></html>
