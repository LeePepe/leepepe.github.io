<!doctype html><html lang=zh-CN><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:13px -apple-system,BlinkMacSystemFont,system-ui;color:var(--ink);background:var(--bg)}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;min-height:32px;padding:0 12px;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.tag,.meta{color:var(--muted)}p{line-height:1.5}.status{font-size:20px;font-weight:650}.stages,.slots{display:grid;gap:8px;margin-top:18px}.stages span,.slots span{padding:9px;border-left:2px solid var(--accent);background:var(--surface)}.intent,.settled{margin-top:16px;padding:14px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;display:flex;gap:10px;flex-wrap:wrap}.intent b{flex-basis:100%}@media(prefers-reduced-motion:reduce){*{transition:none!important}}:root{--bg:#FAF3EE;--surface:#F1E5DF;--focus:#FFFBF8;--ink:#422631;--muted:#795564;--accent:#9B294D;--line:#DBC5CC}html[data-theme=dark]{--bg:#251B20;--surface:#31242B;--focus:#402D36;--ink:#FFF3EF;--muted:#D8B9C5;--accent:#FFB0CB;--line:#6A4D5C}.edition{margin:28px 32px;display:grid;grid-template-columns:744px 408px;gap:64px}.edition>header{grid-column:1/-1;height:56px}.edition h1{margin:0;font-size:28px}.article{height:624px;overflow:auto}.article h2{font:36px/1.2 Georgia,serif}.article .lead{font-size:18px}.directory{height:624px;background:var(--surface);padding:16px}.directory button{display:block;width:100%;height:120px;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0}.directory button.selected{color:var(--accent);border-left:3px solid var(--accent)}</style></head><body data-sel=3><div class=edition><header><h1>晨间副刊 <span class=tag>演示版 · 非实时</span></h1></header><article class="article" data-job-focus><div class=top><h2><svg viewBox="0 0 24 24" width="24" height
