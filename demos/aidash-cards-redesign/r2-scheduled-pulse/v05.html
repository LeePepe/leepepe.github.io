<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>快慢双页</title><style>
:root{--bg:#f4f1eb;--card:#fffefa;--fast:#ecf2ed;--daily:#f7f3ea;--ink:#25352b;--muted:#5d6b60;--green:#31694e;--ok:#276b48;--focus:#3c7457}[data-theme=dark]{--bg:#111a17;--card:#1c2923;--fast:#2a3b31;--daily:#24302a;--ink:#f0f5ed;--muted:#b9cbbb;--green:#a4dab8;--ok:#94dfb3;--focus:#b9edc9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{width:1104px;height:576px;margin:112px auto;background:var(--card);border-radius:28px;padding:24px;box-shadow:0 12px 30px #25352b16}main>header{height:44px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}.when{font-size:13px;color:var(--muted)}.bench{height:464px;margin-top:20px;display:grid;grid-template-columns:424px 608px;gap:24px}.tempo{padding:20px;border-radius:18px}.tempo.fast{background:var(--fast)}.tempo.daily{background:var(--daily)}.tempo h2{font-size:13px;color:var(--muted);margin:0 0 12px}.records{display:grid;gap:12px}.record{border-radius:14px;background:var(--card);overflow:hidden}.choose{width:100%;height:88px;border:0;background:transparent;color:var(--ink);padding:0 16px;text-align:left;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.choose:focus-visible,.primary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.choose strong{font-size:15px}.choose span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.well{padding:0 16px 16px;min-height:76px}.record.open .choose{height:70px}.record.open .well{display:block}.well output{font-size:32px;font-weight:700;display:block}.well p{margin:4px 0;color:var(--muted);font-size:13px}.primary{height:32px;background:var(--green);color:#fff;border:0;border-radius:10px;padding:0 14px;cursor:pointer;font-weight:600}.route{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.route span{border:1px solid var(--green);border-radius:9px;padding:5px 7px;font-size:13px}.daily .record:first-child{min-height:316px}.daily .record:nth-child(2){min-height:88px}.feedback{font-size:13px;color:var(--muted);margin:8px 0}.receipt{color:var(--green);font-size:13px;margin-left:8px;cursor:pointer}
</style></head><body><main class="topology-two-speed-bench"><header><h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12a8 8 0 0 1 8-8M12 4v4M20 12a8 8 0 0 1-8 8M12 16v4"/></svg> 快慢双页 · Scheduled Pulse</h1><span class="when">11月15日 04:15</span></header><section class="content"><div class="bench"><section class="tempo fast"><h2>高频工作 · 分钟节律</h2><div class="records" id="fast"></div></section><section class="tempo daily"><h2>每日工作 · 固定投递</h2><div class="records" id="daily"></div></section></div></section></main><script id="page-config" type="application/json">{"id":"v05","metadata":{"prompt_file":"prompts/v05-prompt.md","prompt_sha256":"55928f81312064a494b231b0de822abb48bf85e1276fbdf97c9bb515271c320a","topology":"two-speed-bench"}}</script><script>
const jobs=[['linear-bot-bridge','Linear @bot 桥接','每 1 分钟','04:14 完成'],['my-pr-supervisor','我的 PR','每 5 分钟','04:10 完成'],['pr-auto-review','PR 自动审查','每 5 分钟','04:10 完成'],['aidata-digest','个人数仓晨报','每日 04:00','5/5 · 04:01 完成'],['daily-learning','每日学习推荐','每日 04:15','已投递 3 题 · 04:15 完成']];let chosen=2;function record(j,i){let open=i===chosen;return `<article class="record ${open?'open':''}"><button class="choose" data-i="${i}"><span><strong>${j[1]}</strong><span>${j[2]}</span></span><b>${j[3]}</b></button>${open?`<div class="well"><output>${i===3?'5/5':i===4?'3 题':'04:10'}</output><p>${i===3?'最新回执 · 04:01 完成':i===4?'每日 3 题直投 Linear':j[3]}</p>${i===3?'<div class="route"><span>① 个人源采集</span><span>② L2-L3 入仓</span><span>③ Retro-ROI</span><span>④ 学习寻题</span><span>⑤ Brief 投递</span></div>':''}<button class="primary" data-run="${i}">立即运行</button><span class="receipt">查看回执</span><p class="feedback" aria-live="polite"></p></div>`:''}</article>`}function draw(){fast.innerHTML=jobs.slice(0,3).map((j,i)=>record(j,i)).join('');daily.innerHTML=jobs.slice(3).map((j,i)=>record(j,i+3)).join('');document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;draw()});document.querySelectorAll('[data-run]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.textContent='已排队';let f=b.nextElementSibling.nextElementSibling;setTimeout(()=>b.textContent='运行中',300);setTimeout(()=>{b.textContent='刚刚完成 · 耗时 14s';f.textContent='本次运行已完成'},900)});document.querySelectorAll('.receipt').forEach(x=>x.onclick=()=>x.nextElementSibling.textContent='最新回执已读取')}draw();</script></body></html>
