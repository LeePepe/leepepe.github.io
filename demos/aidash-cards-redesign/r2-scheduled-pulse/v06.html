<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定时脉搏 · 胶囊节拍器</title><style>
:root{color-scheme:light;--bg:#edf5f8;--card:#fff;--capsule:#e3f0f5;--well:#f4f8fa;--ink:#17313d;--muted:#526c79;--accent:#145e7c;--ok:#2b6c50;--line:#cfe0e7} [data-theme=dark]{color-scheme:dark;--bg:#0c181e;--card:#192b34;--capsule:#29424f;--well:#21353f;--ink:#edf8fd;--muted:#b6d0dc;--accent:#9bdaf2;--ok:#99e0ba;--line:#3a5661}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;min-height:100vh;padding:150px 80px}main{width:1120px;height:500px;background:var(--card);border-radius:28px;padding:24px;box-shadow:0 8px 28px #17313d14}header{height:40px;display:flex;align-items:center;gap:12px}h1{font-size:20px;margin:0}header span{font-size:13px;color:var(--muted)}section.content{display:block}.capsule-spine{display:grid;grid-template-columns:210px 180px 196px 220px 218px;gap:12px;margin-top:24px}.capsule-spine button{height:88px;border:0;border-radius:16px;background:var(--well);color:var(--ink);padding:14px;text-align:left;cursor:pointer;font:inherit}.capsule-spine button[aria-pressed=true]{background:var(--capsule);box-shadow:inset 0 -4px var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.job-name{display:block;font-weight:650;margin-bottom:8px}.cadence{display:block;color:var(--muted);font-size:13px}.definition-well{margin-top:24px;height:276px;background:var(--well);border-radius:20px;padding:24px;display:grid;grid-template-columns:416px 1fr;gap:32px}.readout{border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.readout small{color:var(--muted);font-size:13px}.readout output{font-size:40px;font-variant-numeric:tabular-nums;font-weight:720;display:block;margin:4px 0}.readout strong{font-size:15px}.run{margin-top:22px;width:116px;height:36px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}.detail-slot{padding-top:2px}.detail-slot h2{font-size:20px;margin:0 0 10px}.detail-slot p{margin:6px 0;color:var(--muted)}.evidence{display:grid;gap:7px;margin:12px 0 0;padding:0;list-style:none}.evidence li{font-size:13px;color:var(--muted);display:flex;gap:8px}.evidence b{color:var(--ok)}.receipt{border-left:3px solid var(--accent);padding-left:12px}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="topology-capsule-definition" data-theme="light"><header><span aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 17V7m4 7V5m4 10V9m4 6V3m4 12v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><h1>定时脉搏</h1><span>一眼看见下一次节拍</span></header><section class="content"><dl class="capsule-spine" id="jobs"></dl><div class="definition-well"><section class="readout" id="readout"></section><section class="detail-slot" id="details"></section></div></section></main><script>
const jobs=[{id:'linear-bot-bridge',name:'Linear @bot 桥接',cadence:'每 1 分钟',next:'04:15',last:'04:14',note:'到点了'},{id:'my-pr-supervisor',name:'我的 PR',cadence:'每 5 分钟',next:'04:20',last:'04:10',note:'最近完成'},{id:'pr-auto-review',name:'PR 自动审查',cadence:'每 5 分钟',next:'04:20',last:'04:10',note:'最近完成'},{id:'aidata-digest',name:'个人数仓晨报',cadence:'每日 04:00',next:'明日 04:00',last:'04:01',note:'5/5 阶段通过',digest:true},{id:'daily-learning',name:'每日学习推荐',cadence:'每日 04:15',next:'明日 04:15',last:'04:15',note:'每日 3 题直投 Linear',learning:true}];let chosen=0,mode='summary',feedback='';const $=s=>document.querySelector(s);
function render(){const root=$('#jobs');root.innerHTML=jobs.map((j,i)=>`<div class="definition-item"><dt><button aria-pressed="${i===chosen}" data-i="${i}"><span class="job-name">${j.name}</span><span class="cadence">${j.cadence}</span></button></dt><dd class="hidden"></dd></div>`).join('');root.querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;mode='summary';feedback='';render()});const j=jobs[chosen];$('#readout').innerHTML=`<small>下一次节拍</small><output>${feedback||j.next}</output><strong>${feedback?'刚刚完成 · 耗时 14s':j.note}</strong><small>上次完成 ${j.last}</small><button class="run" id="run"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 8 6-8 6V6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>立即运行</button>`;let body=mode==='receipt'?`<div class="receipt"><h2>回执</h2><p>上次完成 ${j.last} · 记录已收纳</p><p>${j.digest?'5/5 阶段通过':j.learning?'已投递 3 题':'运行结果已完成'}</p></div>`:j.digest&&mode==='stages'?`<h2>阶段详情</h2><ol class="evidence"><li><b>①</b>个人源采集</li><li><b>②</b>L2-L3 入仓</li><li><b>③</b>Retro-ROI</li><li><b>④</b>学习寻题</li><li><b>⑤</b>Brief 投递</li></ol>`:`<h2>当前记录</h2><p>${j.cadence} · 上次完成 ${j.last}</p><p>${j.learning?'每日 3 题直投 Linear':j.digest?'今日 5/5 阶段通过':'最近一次运行已完成'}</p><button class="run" id="more">${j.digest?'阶段详情':'查看回执'}</button>`;$('#details').innerHTML=body;$('#run').onclick=()=>{feedback='已排队';render();setTimeout(()=>{feedback='运行中';render()},500);setTimeout(()=>{feedback='';mode='receipt';render()},1200)};if($('#more'))$('#more').onclick=()=>{mode=j.digest?'stages':'receipt';render()}}
render();addEventListener('keydown',e=>{if(e.key==='Escape'&&mode!=='summary'){mode='summary';render()} });addEventListener('message',e=>{if(e.source===parent&&['light','dark'].includes(e.data?.theme))document.documentElement.dataset.theme=e.data.theme});
</script></body></html>
