<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定时脉搏 · 晨间纸袋</title><style>
:root{--desk:#f4f0e9;--pocket:#fffcf5;--front:#fff;--rear:#f1eee6;--ink:#2a352c;--muted:#626c5e;--commit:#4c6542;--ok:#2f6a46;--focus:#577548}[data-theme=dark]{--desk:#161b18;--pocket:#222c26;--front:#303c33;--rear:#29342d;--ink:#f1f4e9;--muted:#c0ccb8;--commit:#c2daa9;--ok:#aae0b8;--focus:#dbefc3}*{box-sizing:border-box}body{margin:0;padding:82px 120px;background:var(--desk);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{width:1040px;height:636px;background:var(--pocket);border-radius:28px;padding:24px;box-shadow:0 10px 28px #2a352c16}header{height:40px;display:flex;align-items:center;gap:12px}h1{font-size:20px;margin:0}header small{color:var(--muted)}.content{margin-top:20px;height:528px;position:relative}.paper-pocket{position:relative;height:100%;padding-top:44px}.paper{position:absolute;left:50%;transform:translateX(-50%);width:calc(864px + var(--depth)*16px);height:380px;background:var(--rear);border-radius:18px;box-shadow:0 4px 12px #2a352c14;transition:top .18s ease}.paper header{height:44px;padding:0 16px;cursor:pointer;position:relative;z-index:20}.paper header button{border:0;background:none;color:var(--ink);font:inherit;font-weight:650;display:flex;align-items:center;gap:8px;width:100%;height:44px;text-align:left;cursor:pointer}.paper header time{font-size:13px;color:var(--muted);margin-left:auto}.paper[aria-current=true]{background:var(--front);z-index:5;height:336px;top:44px;width:928px}.paper[aria-current=true] .paper-body{display:block}.paper-body{display:none;padding:20px 24px}.paper-body output{font-size:36px;font-variant-numeric:tabular-nums;font-weight:720;display:block}.paper-body p{color:var(--muted);font-size:13px;margin:5px 0}.fold-checks{display:flex;gap:10px;color:var(--ok);margin:14px 0;font-size:18px}.paper-body button{height:36px;border:0;border-radius:18px;background:var(--commit);color:#fff;padding:0 16px;font-weight:650;cursor:pointer}.paper button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.inset{border-top:1px solid #00000012;margin-top:14px;padding-top:12px;min-height:120px}.route{padding-left:20px;color:var(--ok);font-size:13px;margin:0}.live-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body><main class="topology-paper-pocket-deck"><header><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 8h16v11H4zM4 8l4-4h8l4 4M8 8v3l4 2 4-2V8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><h1>晨间纸袋</h1><small>一张纸，带出一个结果</small></header><section class="content"><div class="paper-pocket" id="pocket"></div><p class="live-status" aria-live="polite"></p></section></main><script>
const papers=[{id:'linear-bot-bridge',title:'Linear @bot 桥接',cadence:'每 1 分钟',latest:'04:14'},{id:'my-pr-supervisor',title:'我的 PR',cadence:'每 5 分钟',latest:'04:10'},{id:'pr-auto-review',title:'PR 自动审查',cadence:'每 5 分钟',latest:'04:10'},{id:'daily-learning',title:'每日学习推荐',cadence:'每日 04:15',latest:'04:15',learning:true},{id:'aidata-digest',title:'个人数仓晨报',cadence:'每日 04:00',latest:'04:01',digest:true}];let front=4,expanded=false,feedback='';function render(){const box=document.querySelector('#pocket');box.innerHTML=papers.map((p,i)=>`<article class="paper" aria-current="${i===front}" style="--depth:${(i-front+papers.length)%papers.length};top:${((i-front+papers.length)%papers.length)*44}px"><header><button data-index="${i}"><span aria-hidden="true">${i===front?'◈':'◇'}</span>${p.title}<time>${p.cadence}</time></button></header><section class="paper-body"><output>${feedback&&i===front?feedback:p.digest?'5/5':p.learning?'3 题':p.latest}</output><p>${feedback&&i===front?'刚刚完成 · 耗时 14s':p.digest?'阶段通过 · 04:01 完成':p.learning?'每日 3 题直投 Linear':'最近完成 '+p.latest}</p>${p.digest&&!expanded?'<div class="fold-checks">✓ ✓ ✓ ✓ ✓</div>':''}<button class="commit" data-action="${p.digest&&!expanded?'details':'run'}">${p.digest&&!expanded?'阶段详情':'立即运行'}</button><div class="inset">${expanded&&p.digest?'<ol class="route"><li>个人源采集</li><li>L2-L3 入仓</li><li>Retro-ROI</li><li>学习寻题</li><li>Brief 投递</li></ol>':'<p>查看回执 · 记录可追溯</p>'}</div></section></article>`).join('');box.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{front=+b.dataset.index;expanded=false;feedback='';render()});box.querySelector('[data-action]')?.addEventListener('click',()=>{const p=papers[front];if(p.digest&&!expanded){expanded=true;render();return}feedback='已排队';render();setTimeout(()=>{feedback='运行中';render()},500);setTimeout(()=>{feedback='刚刚完成 · 耗时 14s';render()},1200)})}render();addEventListener('keydown',e=>{if(e.key==='Escape'){expanded=false;render()}});addEventListener('message',e=>{if(e.source===parent&&['light','dark'].includes(e.data?.theme))document.documentElement.dataset.theme=e.data.theme});
</script></body></html>
