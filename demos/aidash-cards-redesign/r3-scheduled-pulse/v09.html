<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIDash v09</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#f3f1eb;color:#30372f}body[data-theme=dark]{background:#121a16;color:#f3f6ee}button{font:inherit;border:0;cursor:pointer;min-width:32px;min-height:32px;border-radius:12px;color:inherit;background:transparent}button:focus-visible{outline:3px solid #086bc9;outline-offset:2px}.shell{width:1120px;height:624px;margin:88px auto;padding:24px;border-radius:28px;background:#e9e5db;box-shadow:0 1px 2px #2a38260a,0 8px 18px #2a382612,0 22px 38px #2a382616;position:relative;overflow:hidden}.dark{display:none}.theme-aware{background:#fffcf5;color:#30372f}.theme-aware{--paper:#fffef8;--panel:#e9e5db;--ink:#30372f;--muted:#596355;--accent:#405f46;--success:#2d6748;--focus:#086bc9}body[data-theme=dark] .theme-aware{--paper:#324438;--panel:#233129;--ink:#f3f6ee;--muted:#c2d0be;--accent:#b8d8b7;--success:#a3e0b7}.content{height:576px;position:relative}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.1}h2{font-size:15px}p,.meta,li{font-size:12px;line-height:1.3}.muted{color:var(--muted)}.num,time,output{font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#ffffff75;color:var(--accent);font-size:12px}.status{color:var(--success);font-weight:650}.job{position:relative;background:var(--paper);border-radius:14px;padding:10px 12px;min-height:54px;box-shadow:0 5px 13px #26332614;transition:transform 460ms cubic-bezier(0.22,1.35,0.36,1),box-shadow 460ms cubic-bezier(0.22,1.35,0.36,1);cursor:pointer}.job:hover,.job[data-selected=true]{transform:translateY(-6px);box-shadow:0 12px 22px #26332624}.job button{position:absolute;inset:0;width:100%;height:100%;text-align:left;padding:10px 12px}.job strong{display:block;font-size:13px}.job .meta{display:flex;justify-content:space-between;color:var(--muted);margin-top:5px}.lip{position:relative}.lip:before{content:"";position:absolute;left:8%;right:8%;top:-1px;height:16px;background:var(--paper);border-radius:0 0 50% 50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.68)}.receipt{background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 1px 3px #25324a0a,0 9px 20px #25324a12,0 25px 44px #25324a18;transition:transform 500ms cubic-bezier(0.22,1.35,0.36,1),opacity 420ms ease}.receipt[data-open=false]{transform:translateY(112px);opacity:.92}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.receipt ol{margin:8px 0 0;padding:0;list-style:none}.receipt li{padding:5px 0;border-bottom:1px solid #72806b28;display:flex;justify-content:space-between;gap:8px}.ring{width:120px;height:120px}.ring circle{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:16 84;transform:rotate(-90deg);transform-origin:50% 50%;transition:opacity 300ms ease,stroke 300ms ease}.ring circle[data-active=true]{stroke:var(--success);opacity:1}.ring circle:not([data-active=true]){opacity:.42}.ring-hit{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.ring-hit button{min-width:28px;min-height:28px;opacity:0}.icon{width:24px;height:24px;vertical-align:middle}.action{background:var(--accent);color:#f7fbf2;padding:8px 14px;border-radius:12px;font-weight:650}.action:disabled{opacity:.55;cursor:default}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:120ms!important;animation:none!important}.job:hover,.job[data-selected=true]{transform:none}.receipt{transition:opacity 120ms ease}}
.passbook-frame{height:576px;padding:20px;border-radius:24px;background:#e8e8e2;position:relative}.notched-lip-front{height:100px;padding:16px 180px 16px 20px;display:flex;align-items:center;justify-content:space-between;background:#fffcf5;border-radius:18px 18px 34px 34px;box-shadow:inset 0 1px 0 #ffffffda}.passbook-page-switch{display:flex;gap:6px}.passbook-page-switch button{background:#e8e8e2;padding:6px 10px}.insert-slots{height:356px;padding:14px;position:relative}.fast-passbook-insert,.daily-passbook-insert{display:grid;gap:7px;width:70%}.daily-passbook-insert{margin-top:12px}.ring-stamp-panel{position:absolute;right:30px;top:34px;text-align:center}.ring-stamp-panel .ring{display:block}.ring-stamp-panel output{position:relative;top:-76px;font-size:22px;font-weight:700}.receipt-passbook-insert{position:absolute;inset:14px;top:238px;height:126px}.receipt-passbook-columns{margin-top:8px}.passbook-action-bar{height:48px;display:flex;align-items:center;gap:14px}.passbook-action-bar p{color:var(--success)}</style></head><body data-theme="light"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><main class="shell theme-aware topology-swiss-passbook-pocket"><section class="content"><article class="passbook-frame"><header class="notched-lip-front"><div><span class="eyebrow">R3 · Native paper pocket</span><h1>瑞士三页通行袋</h1></div><nav class="passbook-page-switch"><button data-page="fast">高频 3</button><button data-page="slow">日批 2</button></nav><time>11月15日 04:15</time></header><div class="insert-slots"><section class="fast-passbook-insert"><h2>高频脉搏 · 分钟级</h2><div class="job" data-job="linear-bot-bridge"><button aria-label="Linear @bot 桥接"><strong>Linear @bot 桥接</strong><span class="meta"><span>每 1 分钟</span><span class="status">04:14 · 完成</span></span></button></div><div class="job" data-job="my-pr-supervisor"><button aria-label="我的 PR"><strong>我的 PR</strong><span class="meta"><span>每 5 分钟</span><span class="status">04:10 · 完成</span></span></button></div><div class="job" data-job="pr-auto-review"><button aria-label="PR 自动审查"><strong>PR 自动审查</strong><span class="meta"><span>每 5 分钟</span><span class="status">04:10 · 完成</span></span></button></div></section><section class="daily-passbook-insert"><h2>每日批处理 · 晨间定投</h2><div class="job" data-job="aidata-digest"><button aria-label="个人数仓晨报"><strong>个人数仓晨报</strong><span class="meta"><span>每日 04:00</span><span class="status">04:01 · 5/5</span></span></button></div><div class="job" data-job="daily-learning"><button aria-label="每日学习推荐"><strong>每日学习推荐</strong><span class="meta"><span>每日 04:15</span><span class="status">04:15 · 3题</span></span></button></div></section><section class="receipt-passbook-insert receipt" data-open="false"><button class="passbook-receipt-grip" aria-expanded="false">执行回执</button><div class="receipt-passbook-columns receipt-grid"><div><ol class="passbook-stage-list"><li data-stage="collect"><span>① 个人源采集</span><b class="status">通过</b></li><li data-stage="normalize_merge"><span>② L2-L3 入仓</span><b class="status">通过</b></li><li data-stage="retro_roi"><span>③ Retro-ROI</span><b class="status">通过</b></li><li data-stage="learning_topics"><span>④ 学习寻题</span><b class="status">通过</b></li><li data-stage="digest_push"><span>⑤ Brief 投递</span><b class="status">通过</b></li></ol></div><div><ol class="passbook-question-list"><li>如何用证据区分实现缺陷与规格缺口？</li><li>怎样区分 Cache 命中率与上下文占比？</li><li>如何让增量入仓保持幂等？</li></ol></div></div></section></div><aside class="ring-stamp-panel"><svg class="ring" viewBox="0 0 24 24" aria-label="5/5 digest stages"><circle cx="12" cy="12" r="8" pathLength="100" stroke-dashoffset="0" data-stage="collect" data-active="true"/><circle cx="12" cy="12" r="8" pathLength="100" stroke-dashoffset="-20" data-stage="normalize_merge"/><circle cx="12" cy="12" r="8" pathLength="100" stroke-dashoffset="-40" data-stage="retro_roi"/><circle cx="12" cy="12" r="8" pathLength="100" stroke-dashoffset="-60" data-stage="learning_topics"/><circle cx="12" cy="12" r="8" pathLength="100" stroke-dashoffset="-80" data-stage="digest_push"/></svg><output>5/5</output><p>晨报阶段 · 通过</p></aside><footer class="passbook-action-bar"><button class="action run-passbook-job">立即运行</button><p aria-live="polite">刚刚完成 · 耗时14s</p></footer></article></section></main><script>const root=document.documentElement,body=document.body;function theme(t){root.dataset.theme=t;body.dataset.theme=t}window.addEventListener('message',e=>{if(e.data&&e.data.type==='aidash-demo-theme')theme(e.data.theme)});theme(root.dataset.theme||'light');const jobs=[...document.querySelectorAll('[data-job]')],rings=[...document.querySelectorAll('[data-stage]')],live=document.querySelector('[aria-live]');let selected='aidata-digest',running=false;function choose(el){selected=el.dataset.job;jobs.forEach(j=>j.dataset.selected=j.dataset.job===selected);document.querySelectorAll('[data-job] button').forEach(b=>b.setAttribute('aria-pressed',b.parentElement.dataset.job===selected));}jobs.forEach(j=>j.addEventListener('click',()=>choose(j)));rings.forEach((r,i)=>r.addEventListener('click',()=>{rings.forEach(x=>x.dataset.active='false');r.dataset.active='true';const stage=r.dataset.stage;document.querySelectorAll(`[data-stage="${stage}"]`).forEach(x=>x.classList.add('stage-focus'));document.querySelector('.receipt')?.setAttribute('data-open','true')}));function run(button){if(running)return;running=true;button.disabled=true;if(live)live.textContent='已排队';setTimeout(()=>{if(live)live.textContent='运行中'},260);setTimeout(()=>{if(live)live.textContent='刚刚完成 · 耗时14s';button.disabled=false;running=false},800)}const receipt=document.querySelector('.receipt-passbook-insert'),grip=document.querySelector('.passbook-receipt-grip');grip.onclick=()=>{const open=receipt.dataset.open!=='true';receipt.dataset.open=String(open);grip.setAttribute('aria-expanded',String(open))};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelector('.insert-slots').dataset.page=b.dataset.page});document.querySelector('.run-passbook-job').onclick=e=>run(e.currentTarget);document.addEventListener('keydown',e=>{if(e.key==='Escape'){receipt.dataset.open='false';grip.focus()}});choose(document.querySelector('[data-job="aidata-digest"]'));</script></body></html>
