<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待办工单 · One Open Work Order</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:13px;line-height:1.4;background:var(--bg);color:var(--ink)}body{min-height:800px}button,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:32px;padding:5px 10px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.muted{color:var(--muted)}.demo{color:var(--muted);font-size:13px}.intent{border:1px solid var(--accent);background:var(--surface);padding:12px;border-radius:6px}.intent[hidden],[data-action][hidden],[data-lens][hidden]{display:none}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:0;margin:16px 0;list-style:none}.stages li{padding:10px;border:1px solid var(--line);border-top:3px solid #166534}.stages li.warn{border-top-color:#92400E}.stages b{display:block;color:var(--muted);font-size:13px}.candidates{display:grid;gap:8px}.candidates p{margin:0;padding:9px;border:1px dashed var(--line);color:var(--muted)}.lens{display:flex;gap:6px;margin-bottom:12px}.lens button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:var(--dark-bg);--surface:var(--dark-surface);--focus:var(--dark-focus);--ink:var(--dark-ink);--muted:var(--dark-muted);--line:var(--dark-line);--accent:var(--dark-accent);--on-accent:var(--dark-on)}}:root[data-theme=dark]{--bg:var(--dark-bg);--surface:var(--dark-surface);--focus:var(--dark-focus);--ink:var(--dark-ink);--muted:var(--dark-muted);--line:var(--dark-line);--accent:var(--dark-accent);--on-accent:var(--dark-on)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>:root{--bg:#EAF1ED;--surface:#F5F9F5;--focus:#FFFFFF;--ink:#17382B;--muted:#496253;--line:#C6D9CD;--accent:#236044;--on-accent:#fff;--dark-bg:#101E18;--dark-surface:#192A22;--dark-focus:#22372B;--dark-ink:#EDF6E9;--dark-muted:#B3C9B6;--dark-line:#425B49;--dark-accent:#B4D8A5;--dark-on:#172C1C} .page-head{height:72px}.page-head h1{margin:0;font-size:22px}.page-head p{margin:2px 0}.workorder{display:grid;grid-template-columns:760px 424px;gap:32px;height:632px}.paper,.side{background:var(--surface);border:1px solid var(--line);border-radius:6px}.paper{padding:32px}.paper-title{height:52px;display:flex;gap:12px;align-items:center;font-size:17px}.paper h2{font-size:28px;line-height:1.2;max-width:620px;margin:42px 0 12px}.side{padding:36px 20px;display:grid;gap:16px}.side .job{display:block;width:100%;height:112px;padding:14px;border:1px solid var(--line);border-radius:6px}.side .job.selected{background:var(--focus);border-color:var(--accent)}.side .job strong,.side .job span,.side .job small{display:block}.side .job span,.side .job small{margin-top:5px;color:var(--muted)}</style></head><body><script>window.PAGE_DEFAULT=1;</script><main data-variant="2"><header class="page-head"><div><h1>待办工单 · One Open Work Order</h1><p class="demo">演示数据 · 非实时 · 2026-03-16 03:59:20 CST</p></div><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 5h16M4 19h16M7 3v4M17 3v4M5 9h14v8H5z M9 13h6"/></svg></header><section class="workorder"><div class="paper"><div class="paper-title"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 3h9l3 3v15H6z M14 3v5h4 M9 12l2 2 4-4 M9 18h6"/></svg><strong data-selected-name>我的 PR</strong></div><h2>这份旧回执，需要再核对吗？</h2><p class="muted">14m20s 前收到示意回执；这不是已证实失败。</p><div class="lens"><button data-lens-button="result" aria-pressed="true">问题</button><button data-lens-button="evidence" aria-pressed="false">翻看证据</button></div><div data-lens="result"><p data-detail>演示证据可读：上一份回执保留在本页。</p></div><div data-lens="evidence" hidden><p data-evidence>演示证据可读</p></div><div class="actions"><button id="run">Run Now · 模拟</button><select id="evidence" aria-label="证据示例"><option value="ready">ready</option><option value="empty">empty</option><option value="stale">stale</option><option value="failed">failed</option></select><span role="status" aria-live="polite"></span></div><div class="intent" data-action="intent" hidden>仅在本页模拟，不启动任务、不发送内容。<div class="actions"><button id="confirm">确认模拟</button><button id="cancel">取消</button></div></div><div class="intent" data-action="committing" hidden aria-busy="true">正在生成本页模拟回执…</div><div class="intent" data-action="settled" hidden>已生成本页模拟回执 · 未发送到外部服务。<button id="return">返回</button></div></div><aside class="side"><button class="job" data-job="0" aria-pressed="True"><strong>Linear @bot 桥接</strong><span>每 1 分钟</span><small>示意正常</small></button><button class="job" data-job="2" aria-pressed="False"><strong>特定人 PR</strong><span>每 5 分钟</span><small>合并跳过</small></button><button class="job" data-job="3" aria-pressed="False"><strong>每日简报</strong><span>每日 04:00 CST</span><small>示例 4/5</small></button><button class="job" data-job="4" aria-pressed="False"><strong>每日学习推荐</strong><span>每日 04:15 CST</span><small>尚无状态产出</small></button></aside></section></main><script>
const jobs=[
{id:'linear-bot-bridge',name:'Linear @bot 桥接',cadence:'每 1 分钟',status:'示意正常',last:'2026-03-16 03:59:00',next:'04:00 CST'},
{id:'my-pr-supervisor',name:'我的 PR',cadence:'每 5 分钟',status:'回执较旧，非已证实失败',last:'2026-03-16 03:45:00',next:'04:00 CST'},
{id:'pr-auto-review',name:'特定人 PR',cadence:'每 5 分钟',status:'合并跳过，非成功/失败证明',last:'2026-03-16 03:55:00',next:'04:00 CST'},
{id:'aidata-digest',name:'每日简报',cadence:'每日 04:00 CST',status:'示例 4/5、阶段 5 警告',last:'2026-03-15 04:00:00',next:'04:00 CST'},
{id:'daily-learning',name:'每日学习推荐',cadence:'每日 04:15 CST',status:'尚无状态产出；不是失败',last:'暂无状态产出',next:'04:15 CST'}];
let selected=window.PAGE_DEFAULT||0, lens='result', evidence='ready', action='idle';
const rootEl=document.documentElement; const q=new URLSearchParams(location.search).get('appearance'); if(q==='light'||q==='dark') rootEl.dataset.theme=q;
function theme(t){if(t==='light'||t==='dark')rootEl.dataset.theme=t}
window.addEventListener('message',e=>{if(e.source===parent&&e.data&&e.data.type==='aidash-demo-theme')theme(e.data.theme)});
const $=s=>document.querySelector(s), esc=(s)=>s;
function job(){return jobs[selected]}
function evidenceText(){return {ready:'演示证据可读：上一份回执保留在本页。',failed:'演示证据不可用 · 不是实际任务失败。重试示例',empty:'暂无演示回执，不等于失败。',stale:'2026-03-15 04:00 CST · 旧回执，不能推断当前状态。'}[evidence]}
function render(){document.querySelectorAll('[data-job]').forEach(el=>{const isSelected=+el.dataset.job===selected; el.classList.toggle('selected',isSelected);el.setAttribute('aria-pressed',isSelected); if(document.querySelector('main').dataset.variant==='2')el.hidden=isSelected;}); const j=job(); document.querySelectorAll('[data-selected-name]').forEach(el=>el.textContent=j.name); document.querySelectorAll('[data-selected-cadence]').forEach(el=>el.textContent=j.cadence); document.querySelectorAll('[data-evidence]').forEach(el=>el.textContent=evidenceText()); document.querySelectorAll('[data-lens]').forEach(el=>el.hidden=el.dataset.lens!==lens); document.querySelectorAll('[data-action]').forEach(el=>el.hidden=el.dataset.action!==action); const p=$('[data-detail]'); if(p)p.innerHTML=detailMarkup(j); const s=$('[role=status]'); if(s)s.textContent=action==='settled'?'已生成本页模拟回执 · 未发送到外部服务':evidenceText()}
function detailMarkup(j){if(j.id==='aidata-digest')return '<ol class="stages"><li>示意阶段 1 <b>通过</b></li><li>示意阶段 2 <b>通过</b></li><li>示意阶段 3 <b>通过</b></li><li>示意阶段 4 <b>通过</b></li><li class="warn">示意阶段 5 <b>待核对</b></li></ol><p>上一次运行已有部分产出；这不等于本次已运行。</p>';if(j.id==='daily-learning')return '<div class="candidates"><p>候选槽 1 · 等待示意内容</p><p>候选槽 2 · 等待示意内容</p><p>候选槽 3 · 等待示意内容</p></div>';return '<p>上次回执：'+j.last+' · '+j.status+'</p><p>'+evidenceText()+'</p>'}
function select(i){if(action==='committing')return;selected=i;action='idle';lens='result';evidence='ready';render();document.querySelector('[data-job="'+i+'"]')?.focus()}
function openIntent(){if(action==='idle'||action==='settled'){action='intent';render();$('#confirm')?.focus()}}
function cancel(){if(action==='intent'){action='idle';render();$('#run')?.focus()}}
function confirmRun(){if(action!=='intent')return;action='committing';render();setTimeout(()=>{action='settled';render();$('#return')?.focus()},800)}
function returnIdle(){action='idle';render();$('#run')?.focus()}
function setLens(v){lens=v;render()}
document.addEventListener('click',e=>{const jobBtn=e.target.closest('[data-job]'); if(jobBtn)select(+jobBtn.dataset.job); if(e.target.closest('#run'))openIntent(); if(e.target.closest('#cancel'))cancel(); if(e.target.closest('#confirm'))confirmRun(); if(e.target.closest('#return'))returnIdle(); if(e.target.matches('[data-lens-button]'))setLens(e.target.dataset.lensButton); if(e.target.matches('#evidence')){evidence=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancel(); const b=e.target.closest('[data-job]'); if(!b)return; if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();select((selected+1)%jobs.length)} if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();select((selected+jobs.length-1)%jobs.length)}});
render();
</script></body></html>
