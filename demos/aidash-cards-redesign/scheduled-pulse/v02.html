</style></head><body><main class="topology-cadence-stations"><header class="top"><h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M12 5v14"/></svg> Scheduled Pulse · 节律站台</h1><span class="clock">11月15日 04:15</span></header><section class="content"><figure><figcaption>按频率分组的五项工作</figcaption><section class="lane frequent"><h2>每分钟与每五分钟</h2><ol id="fast"></ol></section><section class="lane daily"><h2>每日节律</h2><ol id="slow"></ol></section></figure></section></main><script id="page-config" type="application/json">{"id":"v02","metadata":{"prompt_file":"prompts/v02-prompt.md","prompt_sha256":"4129342d7d934336b5b8dea30be7dfaeb587224a47bcd7e1c4fd5f897a4b9e5a","topology":"cadence-stations"}}</script><script>
const records=[{id:'linear-bot-bridge',name:'Linear @bot 桥接',cad:'每 1 分钟',time:'04:14',state:'已完成'},{id:'my-pr-supervisor',name:'我的 PR',cad:'每 5 分钟',time:'04:10',state:'待运行'},{id:'pr-auto-review',name:'PR 自动审查',cad:'每 5 分钟',time:'04:10',state:'已完成'},{id:'aidata-digest',name:'个人数仓晨报',cad:'每日 04:00',time:'04:01',state:'5/5'},{id:'daily-learning',name:'每日学习推荐',cad:'每日 04:15',time:'04:15',state:'已投递 3 题'}];let active=1;function row(r,i){let open=i===active;return `<li><button class="station${open?' active':''}" data-i="${i}"><time>${open&&i===1?'04:15':r.time}</time><strong>${r.name}</strong><small>${r.cad} · ${r.state}</small>${open?`<div class="detail"><p>${r.id==='aidata-digest'?'个人数仓晨报 · 04:01 完成':'最新成功 '+r.time}</p>${r.id==='aidata-digest'?'<div class="stages"><span>① 个人源采集</span><span>② L2-L3 入仓</span><span>③ Retro-ROI</span><span>④ 学习寻题</span><span>⑤ Brief 投递</span></div>':r.id==='daily-learning'?'<p>每日 3 题直投 Linear</p>':''}<button class="action" data-run="${i}">立即运行</button><div class="receipt">查看回执</div></div>`:''}</button></li>`}function render(){fast.innerHTML=records.slice(0,3).map((r,i)=>row(r,i)).join('');slow.innerHTML=records.slice(3).map((r,i)=>row(r,i+3)).join('');document.querySelectorAll('.station').forEach(b=>b.onclick=e=>{if(e.target.closest('.action')){e.stopPropagation();e.target.textContent='已排队';setTimeout(()=>e.target.textContent='运行中',300);setTimeout(()=>e.target.textContent='刚刚完成 · 耗时 14s',900);return}active=+b.dataset.i;render()})}render();</script></body></html>
