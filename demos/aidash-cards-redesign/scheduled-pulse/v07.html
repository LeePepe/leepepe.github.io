((n,i)=>`<span>◉ 示意阶段 ${n} · ${i<4?'通过':'警告'}</span>`).join('')+'</div>':id==='daily-learning'&&mode==='summary'?'<div class=slots><span>候选 1 · 等待生成（演示）</span><span>候选 2 · 等待生成（演示）</span><span>候选 3 · 等待生成（演示）</span></div>':'';return `<p class=status>${x}</p><p>演示数据 · 非实时 · ${id==='daily-learning'?'尚无状态产出':'上次回执 2026-03-16 03:55:00'} · 下次计划 ${c}</p>${mode==='evidence'?'<div class=evidence-nav><button data-ev=ready>恢复示例</button><button data-ev=failed>失败示例</button><button data-ev=empty>空示例</button><button data-ev=stale>陈旧示例</button></div>':''}${extra}`+(run==='intent'?'<div class=intent><b>仅在本页模拟，不启动任务、不发送内容</b><button data-ok>确认模拟</button><button data-no>取消</button></div>':'')+(run==='commit'?'<div class=settled aria-busy=true>正在生成本页演示回执…</div>':'')+(run==='settled'?'<div class=settled tabindex=-1>已生成本页模拟回执 · 未发送到外部服务 <button data-reset>返回</button></div>':'')}function render(){ $$('[data-job]').forEach((b,i)=>{b.classList.toggle('selected',i===sel);b.setAttribute('aria-current',i===sel)});let d=$('[data-detail]');if(!d)return;d.innerHTML=detail();$$('[data-ok]').forEach(b=>b.onclick=()=>{run='commit';render();setTimeout(()=>{run='settled';render()},800)});$$('[data-no]').forEach(b=>b.onclick=()=>{run='idle';render()});$$('[data-reset]').forEach(b=>b.onclick=()=>{run='idle';render()});$$('[data-job]').forEach(b=>b.onclick=()=>{if(run!=='commit'){sel=+b.dataset.job;mode='summary';ev='ready';run='idle';render()}});$('[data-run]')?.addEventListener('click',()=>{if(run==='idle'){run='intent';render()}});$('[data-mode]')?.addEventListener('click',()=>{mode=mode==='summary'?'evidence':'summary';render()});$$('[data-ev]').forEach(b=>b.onclick=()=>{ev=b.dataset.ev;mode='evidence';render()})}addEventListener('keydown',e=>{if(e.key==='Escape'){run='idle';mode='summary';render()}});render();</script></body></html>
