<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定时脉搏 · 证据矩阵</title><style>
:root{--bg:#f1f4f7;--paper:#fff;--focus:#edf2fa;--ink:#202d40;--muted:#566a81;--select:#344f91;--ok:#286d4f;--line:#dbe3ec} [data-theme=dark]{--bg:#101821;--paper:#1d2936;--focus:#2a3a50;--ink:#f0f6ff;--muted:#b8cce4;--select:#aac9ff;--ok:#93e1b5;--line:#405269}*{box-sizing:border-box}body{margin:0;padding:116px 100px;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{width:1080px;height:568px;border-radius:24px;background:var(--paper);padding:24px}header{height:36px;display:flex;gap:12px;align-items:center}h1{font-size:19px;margin:0}header small{color:var(--muted)}.content{margin-top:8px}.evidence-matrix{display:grid;grid-template-columns:248px 176px 560px;grid-template-rows:32px repeat(5,52px);gap:12px 24px}.column-labels{display:contents}.column-labels span{height:32px;color:var(--muted);font-size:13px;padding:8px 16px}.job-record{display:contents}.job-record>*{min-height:0;margin-bottom:0;padding:14px 16px;background:transparent}.job-record[aria-selected=true]>*{background:var(--focus)}.job-record[aria-selected=true] [role=gridcell=result]{border-radius:16px}.rowheader{border-radius:16px 0 0 16px}.rowheader button{border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;padding:0;width:100%;height:100%;min-height:28px;font-weight:650;display:flex;align-items:center}.rowheader button:focus-visible,.action:focus-visible{outline:3px solid var(--select);outline-offset:3px}.cadence{color:var(--muted);font-size:13px;border-radius:0}.result{border-radius:0 16px 16px 0;position:relative}.result output{display:block;font-size:15px;font-weight:650}.job-record[aria-selected=true] .result{padding-top:12px;padding-bottom:12px}.job-record[aria-selected=true] .result output{font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}.result p{margin:3px 0;color:var(--muted);font-size:13px}.checks{display:flex;gap:7px;margin:12px 0}.checks span{color:var(--ok);font-size:18px}.actions{display:flex;gap:8px;align-items:center;margin-top:4px}.action{height:36px;border:0;border-radius:18px;background:var(--select);color:#fff;padding:0 16px;font-weight:650;cursor:pointer}.action.secondary{background:transparent;color:var(--select);border:1px solid var(--select)}.detail{margin-top:8px;font-size:13px;color:var(--muted)}.stage-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding-left:18px;margin:4px 0;font-size:13px}.stage-list li{margin:0;color:var(--ok)}.stage-list li:last-child{grid-column:1 / -1}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="topology-job-evidence-matrix"><header><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h6v6H4zm10 0h6v6h-6zM4 13h6v6H4zm10 0h6v6h-6zM10 8h4m-4 8h4" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/></svg><h1>定时脉搏 · 证据矩阵</h1><small>结果与节拍对齐</small></header><section class="content"><div role="grid" class="evidence-matrix" id="matrix"><div class="column-labels" role="row"><span>作业</span><span>节拍</span><span>结果</span></div></div></section></main><script>
const records=[['linear-bot-bridge','Linear @bot 桥接','每 1 分钟','04:14'],['my-pr-supervisor','我的 PR','每 5 分钟','04:10'],['pr-auto-review','PR 自动审查','每 5 分钟','04:10'],['aidata-digest','个人数仓晨报','每日 04:00','5/5'],['daily-learning','每日学习推荐','每日 04:15','3 题']];let active=3,detail=false,busy='';const m=document.querySelector('#matrix');
function draw(){m.style.gridTemplateRows='32px '+records.map((_,i)=>i===active?'176px':'52px').join(' ');m.querySelectorAll('.job-record').forEach(n=>n.remove());records.forEach((r,i)=>{const row=document.createElement('div');row.className='job-record';row.setAttribute('role','row');row.setAttribute('aria-selected',i===active);row.dataset.id=r[0];row.innerHTML=`<div class="rowheader" role="rowheader"><button>${r[1]}</button></div><div class="cadence" role="gridcell">${r[2]}</div><div class="result" role="gridcell">${i===active?`<output>${busy||r[3]}</output><p>${i===3?'04:01 完成 · 阶段通过':i===4?'已投递 3 题':'上次完成 '+r[3]}</p>${r[0]==='aidata-digest'&&!detail?'<div class="checks">✓ ✓ ✓ ✓ ✓</div>':''}${r[0]==='aidata-digest'&&detail?'<ol class="stage-list"><li>个人源采集</li><li>L2-L3 入仓</li><li>Retro-ROI</li><li>学习寻题</li><li>Brief 投递</li></ol>':''}<div class="actions"><button class="action" data-action="run">立即运行</button><button class="action secondary" data-action="detail">${r[0]==='aidata-digest'?(detail?'收起详情':'阶段详情'):'查看回执'}</button></div>`:`<output>${r[3]}</output><p>✓ ${i===3?'阶段通过':'已完成'}</p>`}</div>`;m.append(row);row.querySelector('.rowheader button').onclick=()=>{active=i;detail=false;busy='';draw()};row.querySelectorAll('.action').forEach(button=>button.onclick=()=>{if(button.dataset.action==='detail'){detail=!detail;busy='';draw();return}busy='已排队';draw();setTimeout(()=>{busy='运行中';draw()},500);setTimeout(()=>{busy='刚刚完成 · 耗时 14s';draw()},1200)});});}draw();addEventListener('keydown',e=>{if(e.key==='Escape'&&detail){detail=false;draw()} });addEventListener('message',e=>{if(e.source===parent&&['light','dark'].includes(e.data?.theme))document.documentElement.dataset.theme=e.data.theme});
</script></body></html>
