<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定时脉搏 · 到点画报</title><style>
:root{--bg:#f2f3f7;--parent:#fff;--poster:#eef0fc;--ink:#242745;--muted:#5f647f;--accent:#6541a1;--ok:#2b6b4e;--focus:#7751b7}[data-theme=dark]{--bg:#121625;--parent:#1d243b;--poster:#2b3354;--ink:#f2f1ff;--muted:#bec4e1;--accent:#d3bcff;--ok:#9de0bc;--focus:#e2d1ff}*{box-sizing:border-box}body{margin:0;padding:100px 112px;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{width:1056px;height:600px;background:var(--parent);border-radius:28px;padding:28px;box-shadow:0 12px 36px #24274512}header{height:40px;display:flex;align-items:center;gap:12px}h1{margin:0;font-size:20px}header small{color:var(--muted)}.content{display:grid;grid-template-columns:640px 328px;gap:32px;margin-top:24px}.poster{height:480px;background:var(--poster);border-radius:20px;padding:28px;position:relative}.poster h2{font-size:24px;margin:0}.poster .cadence{color:var(--muted);font-size:13px;margin-top:4px}.poster output{display:block;font-size:64px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:28px}.clock{display:flex;gap:10px;align-items:center;color:var(--muted);margin:12px 0 16px}.run{height:36px;border:0;border-radius:18px;padding:0 18px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}.run:focus-visible,.job:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.shutter{margin-top:16px;min-height:176px;border-top:1px solid #0000000d;padding-top:16px}.shutter h3{margin:0;font-size:15px}.shutter p{color:var(--muted);margin:7px 0;font-size:13px}.stage-route{padding-left:20px;color:var(--ok);font-size:13px}.register{display:flex;flex-direction:column;gap:16px}.job{height:108px;border:0;border-radius:16px;background:var(--poster);color:var(--ink);padding:18px;text-align:left;cursor:pointer;font:inherit}.job[aria-current=true]{box-shadow:inset 4px 0 var(--accent)}.job strong{display:block;font-size:15px;margin-bottom:8px}.job span{font-size:13px;color:var(--muted);display:block}.sr{position:absolute;left:-10000px}
</style></head><body><main class="topology-editorial-due-poster"><header><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v7l4 2M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><h1>到点画报</h1><small>11月15日 · 04:15</small></header><section class="content"><article class="poster" id="poster"></article><aside class="register" id="register"></aside></section></main><script>
const list=[{id:'linear-bot-bridge',title:'Linear @bot 桥接',cadence:'每 1 分钟',value:'00:00',latest:'04:14',kind:'到点了'},{id:'my-pr-supervisor',title:'我的 PR',cadence:'每 5 分钟',value:'04:20',latest:'04:10',kind:'最近完成'},{id:'pr-auto-review',title:'PR 自动审查',cadence:'每 5 分钟',value:'04:20',latest:'04:10',kind:'最近完成'},{id:'aidata-digest',title:'个人数仓晨报',cadence:'每日 04:00',value:'5/5',latest:'04:01',kind:'阶段通过',digest:true},{id:'daily-learning',title:'每日学习推荐',cadence:'每日 04:15',value:'3 题',latest:'04:15',kind:'已投递 3 题',learning:true}];let selected=0,shutter=false,feedback='';function paint(){const j=list[selected];document.querySelector('#poster').innerHTML=`<h2>${j.title}</h2><div class="cadence">${j.cadence}</div><output>${feedback||j.value}</output><div class="clock"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v7l4 2M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${feedback?'刚刚完成 · 耗时 14s':j.kind}</div><button class="run" id="run">立即运行</button><div class="shutter"><h3>${shutter?(j.digest?'阶段详情':'回执'):'最新记录'}</h3>${shutter&&j.digest?'<ol class="stage-route"><li>个人源采集</li><li>L2-L3 入仓</li><li>Retro-ROI</li><li>学习寻题</li><li>Brief 投递</li></ol>':`<p>${j.learning?'每日 3 题直投 Linear':j.digest?'5/5 阶段通过':'上次完成 '+j.latest}</p><button class="run" id="view">${shutter?'收起详情':'查看回执'}</button>`}</div>`;document.querySelector('#register').innerHTML=list.map((x,i)=>i===selected?'':`<button class="job" aria-current="false" data-i="${i}"><strong>${x.title}</strong><span>${x.cadence}</span><span>最近 ${x.latest}</span></button>`).join('');document.querySelectorAll('.job').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;shutter=false;feedback='';paint()});document.querySelector('#view')?.addEventListener('click',()=>{shutter=!shutter;paint()});document.querySelector('#run').onclick=()=>{feedback='已排队';paint();setTimeout(()=>{feedback='运行中';paint()},500);setTimeout(()=>{feedback='';paint()},1200)}}paint();addEventListener('keydown',e=>{if(e.key==='Escape'){shutter=false;paint()}});addEventListener('message',e=>{if(e.source===parent&&['light','dark'].includes(e.data?.theme))document.documentElement.dataset.theme=e.data.theme});
</script></body></html>
