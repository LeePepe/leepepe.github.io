const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let sel=+document.body.dataset.sel||2,mode='summary',ev='ready',run='idle';
function theme(t){if(['light','dark'].includes(t))document.documentElement.dataset.theme=t}const appearance=new URLSearchParams(location.search).get('appearance');if(appearance)theme(appearance);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='aidash-demo-theme')theme(e.data.theme)});
function evidence(){return {ready:'演示证据可用 · event kind receipt.sample',failed:'演示证据不可用 · 不代表任务失败',empty:'暂无演示回执，不等于失败',stale:'旧回执，不能推断当前状态 · 2026-03-15 03:40 CST'}[ev]}
function detail(){const j=J[sel];let text=mode==='evidence'?evidence():j.status;let extra=j.id==='aidata-digest'&&mode==='summary'?'<div class=stages>'+[1,2,3,4,5].map((n,i)=>`<span>◉ 示意阶段 ${n} · ${i<4?'通过':'警告'}</span>`).join('')+'</div>':j.id==='daily-learning'&&mode==='summary'?'<div class=slots><span>候选 1 · 等待生成（演示）</span><span>候选 2 · 等待生成（演示）</span><span>候选 3 · 等待生成（演示）</span></div>':'';let nav=mode==='evidence'?'<div class=evidence-nav><button data-ev=ready>恢复示例</button><button data-ev=failed>失败示例</button><button data-ev=empty>空示例</button><button data-ev=stale>陈旧示例</button></div>':'';let action=run==='intent'?'<div class=intent><b>仅在本页模拟，不启动任务、不发送内容</b><button data-ok>确认模拟</button><button data-no>取消</button></div>':run==='commit'?'<div class=settled aria-busy=true>正在生成本页演示回执…</div>':run==='settled'?'<div class=settled tabindex=-1>已生成本页模拟回执 · 未发送到外部服务 <button data-reset>返回</button></div>':'';return `<p class=status>${text}</p><p>演示数据 · 非实时 · 上次回执 ${j.last} · 下次计划 ${j.next}</p>${nav}${extra}${action}`}
function render(){const j=J[sel];$$('[data-job]').forEach((b,i)=>{b.dataset.jobId=J[i]?.id||'';b.classList.toggle('selected',i===sel);b.setAttribute('aria-current',i===sel?'true':'false');b.hidden=b.closest('.directory')?i===sel:false;b.style.display=b.hidden?'none':''});$$('[data-p0]').forEach(x=>x.textContent=j.p0);const lead=$('[data-lead]');if(lead)lead.textContent=j.id==='aidata-digest'?'上一次每日简报为 4/5 的演示结果；仍需核对最后一段。':`${j.name} · ${j.status}。`;const last=$('[data-last]');if(last)last.textContent=`${j.last} · 模拟 · 演示数据 · 非实时`;const d=$('[data-detail]');if(d)d.innerHTML=detail();$$('[data-ev]').forEach(b=>b.onclick=()=>{ev=b.dataset.ev;mode='evidence';render()});$$('[data-ok]').forEach(b=>b.onclick=()=>{if(run!=='intent')return;run='commit';render();setTimeout(()=>{run='settled';render()},800)});$$('[data-no]').forEach(b=>b.onclick=()=>{run='idle';render()});$$('[data-reset]').forEach(b=>b.onclick=()=>{run='idle';render()});$$('[data-job]').forEach(b=>b.onclick=()=>{if(run==='commit')return;sel=+(b.dataset.job||0);mode='summary';ev='ready';run='idle';render()});const runBtn=$('[data-run]');if(runBtn)runBtn.onclick=()=>{if(run==='idle'){run='intent';render()}};const modeBtn=$('[data-mode]');if(modeBtn)modeBtn.onclick=()=>{mode=mode==='summary'?'evidence':'summary';render()}}
addEventListener('keydown',e=>{if(e.key==='Escape'){run='idle';mode='summary';render()}});render();</script></body></html>
