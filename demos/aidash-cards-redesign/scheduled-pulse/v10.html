<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定时脉搏 · 一键工作台</title><style>
:root{--surround:#f0f3f9;--card:#fff;--stage:#eef2fb;--register:#f6f8fc;--ink:#1e2c44;--muted:#566980;--commit:#3e55a1;--ok:#286c50;--focus:#355cc0}[data-theme=dark]{--surround:#0e1422;--card:#192339;--stage:#273650;--register:#202c44;--ink:#f1f5ff;--muted:#bacde9;--commit:#b6c8ff;--ok:#98deb9;--focus:#d1ddff}*{box-sizing:border-box}body{margin:0;padding:128px 92px;background:var(--surround);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{width:1096px;height:544px;background:var(--card);border-radius:26px;padding:24px}header{height:40px;display:flex;align-items:center;gap:12px}h1{margin:0;font-size:20px}header small{color:var(--muted)}.content{display:block;margin-top:24px}.command-worktable{display:grid;grid-template-columns:272px 752px;gap:24px;height:432px}.job-register{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;background:var(--register);border-radius:18px;padding:12px}.job-register li{height:72px}.job-register button{width:100%;height:72px;border:0;border-left:3px solid transparent;border-radius:12px;background:transparent;color:var(--ink);text-align:left;padding:12px;font:inherit;cursor:pointer}.job-register button[aria-current=true]{background:var(--stage);border-left-color:var(--commit);font-weight:650}.job-register button:focus-visible,.primary:focus-visible,.tool:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.job-register time{display:block;color:var(--muted);font-size:13px;margin-top:5px}.command-stage{background:var(--stage);border-radius:20px;padding:28px}.latest{height:48px;color:var(--muted);font-size:13px}.primary-command{height:64px}.primary{width:296px;height:64px;border:0;border-radius:16px;background:var(--commit);color:#fff;font-size:40px;font-weight:700;cursor:pointer}.feedback{height:32px;margin-top:16px;color:var(--muted);font-size:13px}.detail-toolbar{height:36px;display:flex;gap:8px;align-items:center}.tool{height:32px;border:1px solid color-mix(in srgb,var(--muted) 30%,transparent);border-radius:12px;background:var(--register);color:var(--ink);padding:0 12px;cursor:pointer}.evidence-slot{margin-top:12px;height:168px;background:var(--register);border-radius:14px;padding:14px}.evidence-slot h2{font-size:15px;margin:0}.evidence-slot p{font-size:13px;color:var(--muted);margin:7px 0}.route{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:12px 0;list-style:none;color:var(--ok);font-size:13px}.route li{padding:5px 8px;border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:8px}.tool[hidden]{display:none}
</style></head><body><main class="topology-run-command-stage"><header><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 5h5v5M5 5l6 6m8 8h-5v-5m5 5-6-6M14 5h5v5m0-5-6 6M10 19H5v-5m0 5 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><h1>一键工作台</h1><small>选中后再提交</small></header><section class="content"><div class="command-worktable"><menu class="job-register" id="register" aria-label="作业选择"></menu><section class="command-stage" id="stage"></section></div></section></main><script>
const jobs=[{id:'linear-bot-bridge',name:'Linear @bot 桥接',cadence:'每 1 分钟',last:'04:14'},{id:'my-pr-supervisor',name:'我的 PR',cadence:'每 5 分钟',last:'04:10'},{id:'pr-auto-review',name:'PR 自动审查',cadence:'每 5 分钟',last:'04:10'},{id:'aidata-digest',name:'个人数仓晨报',cadence:'每日 04:00',last:'04:01',digest:true},{id:'daily-learning',name:'每日学习推荐',cadence:'每日 04:15',last:'04:15',learning:true}];let selected=2,detail=false,status='';function update(){const j=jobs[selected];document.querySelector('#register').innerHTML=jobs.map((x,i)=>`<li><button aria-current="${i===selected}" data-i="${i}">${x.name}<time>${x.cadence} · ${x.last}</time></button></li>`).join('');document.querySelectorAll('#register button').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;detail=false;status='';update()});document.querySelector('#stage').innerHTML=`<p class="latest">上次完成 ${j.last}</p><div class="primary-command"><button class="primary" id="go">立即运行</button></div><output class="feedback" aria-live="polite">${status||'已准备好'}</output><div class="detail-toolbar"><button class="tool" id="detail">${detail?'收起详情':j.digest?'阶段详情':'查看回执'}</button></div><section class="evidence-slot"><h2>${detail?'阶段详情':'结果证据'}</h2>${detail&&j.digest?'<ol class="route"><li>① 个人源采集</li><li>② L2-L3 入仓</li><li>③ Retro-ROI</li><li>④ 学习寻题</li><li>⑤ Brief 投递</li></ol>':`<p>${j.learning?'每日 3 题直投 Linear · 已投递 3 题':j.digest?'5/5 阶段通过':'最近一次运行已完成'}</p>`}</section>`;document.querySelector('#detail').onclick=()=>{detail=!detail;update()};document.querySelector('#go').onclick=()=>{status='已排队';update();setTimeout(()=>{status='运行中';update()},500);setTimeout(()=>{status='刚刚完成 · 耗时 14s';update()},1200)}}update();addEventListener('keydown',e=>{if(e.key==='Escape'&&detail){detail=false;update()}});addEventListener('message',e=>{if(e.source===parent&&['light','dark'].includes(e.data?.theme))document.documentElement.dataset.theme=e.data.theme});
</script></body></html>
