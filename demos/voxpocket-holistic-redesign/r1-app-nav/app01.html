window.addEventListener('blur',()=>{document.body.dataset.inactive='true';cancelRecording()});window.addEventListener('focus',()=>document.body.dataset.inactive='false');document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelRecording()});
const normalizedPlatform=p=>['phone','mobile'].includes(p)?'mobile':['desktop','macos'].includes(p)?'desktop':p==='auto'?'auto':null;
function setTheme(value){if(!['light','dark'].includes(value))return;state.theme=value;document.documentElement.dataset.theme=value;document.body.dataset.theme=value}
function setPlatform(value,explicit=true){const p=normalizedPlatform(value);if(!p)return;if(explicit)platformOverride=p==='auto'?null:p;const next=p==='auto'?(innerWidth>=701?'desktop':'mobile'):p;document.documentElement.dataset.platform=next;document.body.dataset.platform=next;if(next!==state.platform){cancelRecording(false);state.platform=next;if(next==='desktop'&&state.route!=='r3v02_capture')state.workspace=true;render()}}
new MutationObserver(records=>{for(const r of records){const v=r.target.dataset.theme;if(r.attributeName==='data-theme'&&v!==state.theme)setTheme(v)}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
new MutationObserver(records=>{for(const r of records){const v=r.target.dataset.theme;if(r.attributeName==='data-theme'&&v!==state.theme)setTheme(v)}}).observe(document.body,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('message',e=>{if(e.source!==window.parent||e.origin!==location.origin&&!(e.origin==='null'&&location.protocol==='file:'))return;const d=e.data;if(!d||typeof d!=='object'||Array.isArray(d))return;if(!d.type||d.type==='rich-theme')if(d.theme)setTheme(d.theme);if(!d.type||d.type==='rich-platform')if(d.platform)setPlatform(d.platform)});
window.addEventListener('resize',()=>{if(!platformOverride)setPlatform('auto',false)});
window.navigationDemo={dispatch,get currentScreen(){return state.runnerOpen?'runner_status':state.settings?'settings_sheet':state.route},getState:()=>JSON.parse(JSON.stringify(state)),get state(){return JSON.parse(JSON.stringify(state))}};
setTheme(document.documentElement.dataset.theme);document.body.dataset.platform=state.platform;render();

</script></body></html>
