(()=>{const app=document.querySelector('.app'),track=document.querySelector('.track'),capture=document.querySelector('.capture'),mic=document.querySelector('.mic'),status=document.querySelector('.record-status'),settings=document.querySelector('.settings'),scrim=document.querySelector('.scrim'),variant="app03";const state={route:'todo_list',phase:'idle',expanded:null,model:'本地演示',clarity:'跟随系统',session:null,pointer:null,task:0,items:[{title:'整理会议决定',status:'todo',priority:'P0',tags:['#工作'],time:'今天 18:00',subs:['确认负责人','写出下一步'],done:[false,false]},{title:'确认明天安排',status:'inprogress',priority:'P1',tags:['#生活'],time:'明天 10:00',subs:['列出三件事'],done:[false]},{title:'留出阅读时间',status:'done',priority:'P2',tags:['#阅读'],time:'周日 20:00',subs:['选一本书'],done:[true]}]};let timer=0,swipe=null;
const icon=id=>`<svg class="icon"><use href="#${id}"/></svg>`;function renderRows(){document.querySelectorAll('.rows').forEach(x=>x.innerHTML='');state.items.forEach((item,i)=>{const group=i===0?'today':'next',row=document.createElement('article');row.className='row';row.dataset.index=i;row.setAttribute('aria-expanded',String(state.expanded===i));row.innerHTML=`<button class="ring ${item.status==='done'?'done':''}" data-done="${i}" aria-label="切换 ${item.title} 状态">${item.status==='done'?icon('check'):''}</button><div class="row-main"><div class="row-top"><strong>${item.title}</strong><span class="badge priority">${item.priority}</span></div><div class="meta"><span>${item.tags.slice(0,3).join(' ')}</span><span>${item.time}</span><span>${item.status}</span></div><div class="details"><div class="details-inner"><div class="subtasks">${item.subs.map((s,j)=>`<button class="subtask" data-sub="${i}:${j}"><span class="mini-ring ${item.done[j]?'done':''}"></span>${s}</button>`).join('')}</div><div class="control-row"><button data-status="${i}">状态：${item.status}</button><button data-priority="${i}">优先级：${item.priority}</button><button data-time="${i}">时间：${item.time}</button></div><button class="export" data-export="${i}">↗ 一键转 Linear Issue</button> <button class="export" data-copy="${i}">📋 复制导出</button></div></div></div>`;document.querySelector(`.rows[data-group="${group}"]`).append(row)})}

function go(route){if(state.session)cancel();if(route==='settings_sheet'&&state.route!=='todo_list')return;state.route=route;paint()}function openSettings(){state.route='settings_sheet';paint();settings.querySelector('.back').focus()}function closeSettings(){state.route='todo_list';paint();document.querySelector('.gear').focus()}function begin(){if(state.session||state.route==='settings_sheet')return;state.session={route:state.route,target:state.expanded};state.phase='listening';state.notice='';paint()}function release(){if(!state.session||state.phase!=='listening')return;const s=state.session;state.phase='refining';paint();timer=setTimeout(()=>{if(!state.session)return;state.session=null;state.phase='done';if(s.route==='todo_list'){if(s.target===null)state.items.push({title:'整理新想法',status:'todo',priority:'P1',tags:['#VoxPocket'],time:'今天稍后',subs:['确认下一步'],done:[false]});else state.items[s.target].subs.push('确认后续时间');state.notice='已加入本地演示待办'}else{document.querySelector('.sentence').textContent='明天留出时间整理想法。';state.notice='已整理完成'}paint()},360)}function cancel(){if(!state.session)return;clearTimeout(timer);state.session=null;state.phase='idle';state.notice='已取消';paint()}
