  const statusNames = { todo: '待办', inprogress: '进行中', done: '已完成' };

    sentence.style.visibility = isRecording ? 'visible' : 'hidden';

    const idle = isRecording ? '按住录音，松开整理' : target === null ? '按住新建语音待办' : '按住补充当前任务';
    const listening = isRecording ? '🎙️ 正在录音…' : target === null ? '🎙️ 正在新建语音待办…' : `🎙️ 正在继续补充至：${state.items[target].title}`;

  function openSettings() {
    if (state.route !== 'todo_list') return;

  }
  function closeSettings() { state.route = 'todo_list'; paint(); gear.focus(); }
  function toggleRow(i) { cancel(); state.notice = ''; state.phase = 'idle'; state.expanded = state.expanded === i ? null : i; paint(); }

  }
  const markdown = item => `# ${item.title}\n\n- 状态：${item.status}\n- 优先级：${item.priority}\n- 标签：${item.tags.join(' ')}\n- 时间：${item.time}\n\n${item.subs.map((s, j) => `- [${item.done[j] ? 'x' : ' '}] ${s}`).join('\n')}`;
  async function copy(i) {

  document.addEventListener('visibilitychange', () => { if (document.hidden) cancel(); });

  window.addEventListener('keyup', e => { if (e.code === 'Space' && state.session?.kind === 'shortcut') { e.preventDefault(); release(); } });
  app.addEventListener('click', e => {
    const button = e.target.closest('button'), row = e.target.closest('.row'); if (!button) return;
    const i = row ? +row.dataset.index : null;

    else if (button.dataset.action === 'settings') openSettings();
    else if (button.dataset.action === 'close-settings') closeSettings();
    else if (button.dataset.expand !== undefined) toggleRow(i);
    else if (button.dataset.done !== undefined) { cancel(); state.items[i].status = state.items[i].status === 'done' ? 'todo' : 'done'; paint(); }
