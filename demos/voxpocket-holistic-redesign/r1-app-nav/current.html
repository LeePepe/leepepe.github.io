<script>
(()=>{
const config=JSON.parse(document.getElementById('page-config').textContent),variant=config.variant;
const app=document.querySelector('.app'),nav=document.querySelector('.nav'),footer=document.querySelector('.footer'),hold=footer.querySelector('.hold'),fold=footer.querySelector('.fold');
const $=s=>app.querySelector(s),$$=s=>[...app.querySelectorAll(s)],routes=config.routes;
const state={route:variant==='current'?'r3v02_capture':'todo_list',phase:'idle',items:['整理会议决定','确认明天安排','留出阅读时间'],done:[false,false,false],sentence:'准备好时，轻触底部玻璃。',model:'本地演示',destination:'录音',clear:false,expanded:'',notice:'',fold:variant!=='current',midpoint:variant==='app04'};
let timer=null,session=null,pointer=null,keyboard=null,swipe=null;
const normalize=v=>['desktop','macos'].includes(v)?'macos':v==='mobile'?'mobile':null;
const q=new URLSearchParams(location.search);let platform=normalize(q.get('platform'))||'mobile';
document.body.dataset.platform=platform;document.documentElement.dataset.platform=platform;document.documentElement.dataset.theme=q.get('theme')==='dark'?'dark':'light';
function icon(id){return `<svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><use href="#${id}"/></svg>`}
function items(){return `<div class="items">${state.items.map((text,i)=>`<div class="item" data-done="${!!state.done[i]}"><button class="check" data-todo="${i}" aria-pressed="${!!state.done[i]}" aria-label="${state.done[i]?'恢复':'完成'}${text}"><span class="ring">${state.done[i]?icon('check'):''}</span></button><span class="label">${text}</span></div>`).join('')}</div>`}
function settings(){const rows=[['model','语音精炼模型',state.model],['destination','录音完成后默认去向',state.destination],['appearance','快捷键与外观',state.clear?'更清晰界面':'跟随系统']];return rows.map(([id,label,value])=>`<div class="setting-row" aria-expanded="${state.expanded===id}"><button class="setting-button" data-setting="${id}" aria-expanded="${state.expanded===id}"><span>${label}</span><span class="summary">${value}</span></button><div class="setting-detail" ${state.expanded===id?'':'hidden'}>${id==='model'?['本地演示','精炼演示'].map(v=>`<button data-model="${v}" aria-pressed="${state.model===v}">${v}</button>`).join(''):id==='destination'?['录音','Todo'].map(v=>`<button data-destination="${v}" aria-pressed="${state.destination===v}">${v}</button>`).join(''):`<p>⌥Space 录音 · ⌥⇧Space 补充待办</p><button data-clear aria-pressed="${state.clear}">更清晰界面</button>`}</div></div>`).join('')}
function content(slot,kind){if(slot.dataset.content!==kind){slot.innerHTML=kind==='todo'?items():kind==='settings'?settings():'';slot.dataset.content=kind}}
function invalidate(){for(const x of $$('.body-slot'))delete x.dataset.content}
function paint(){app.dataset.phase=state.phase;hold.setAttribute('aria-pressed',state.phase==='listening');hold.setAttribute('aria-label',state.route==='todo_list'?'按住补充待办':'按住录音');footer.querySelector('.notice').textContent=state.notice||(state.route==='settings_sheet'?'设置立即生效':state.route==='todo_list'?'按住补充待办':'按住录音，松开整理');document.body.dataset.clear=String(state.clear);for(const x of $$('.sentence'))x.textContent=state.sentence;const remaining=state.items.length-state.done.filter(Boolean).length;nav.querySelector('[data-route="todo_list"]').setAttribute('aria-label',`Todo，${remaining} 项未完成`);if(variant==='app01')nav.querySelector('[data-route="todo_list"] span').textContent=`Todo (${remaining})`;for(const x of $$('.heading'))if(x.textContent.startsWith('Todo'))x.innerHTML=`Todo <span class="count">${remaining}</span>`}
function mountNav(parent,folded=false){parent.append(nav);nav.hidden=folded&&!state.fold;fold.hidden=!folded;fold.setAttribute('aria-expanded',String(state.fold))}
function render(){
const capture=state.route==='r3v02_capture',setting=state.route==='settings_sheet';app.dataset.route=state.route;app.classList.toggle('midpoint',state.midpoint&&platform==='mobile');
for(const b of nav.querySelectorAll('[data-route]'))b.setAttribute('aria-current',String(b.dataset.route===state.route));hold.hidden=setting;footer.querySelector('.bars').hidden=setting;
if(variant==='app01'){
const drawer=$('.drawer'),dock=$('.capture-dock');drawer.setAttribute('aria-hidden',String(capture));drawer.inert=capture;drawer.querySelector('.heading').textContent=setting?'设置':'Todo';content(drawer.querySelector('.body-slot'),setting?'settings':'todo');(capture?dock:drawer).append(footer);
if(platform==='macos'&&!capture){mountNav(drawer);fold.hidden=true}else mountNav(footer,true);
if(platform==='mobile'&&!capture){fold.hidden=true;nav.hidden=false;nav.setAttribute('aria-label','Fold 展开导航');}
else{fold.innerHTML=icon('fold')+'Fold';fold.setAttribute('aria-label','Fold 导航')}
}else if(variant==='app02'){
for(const c of $$('.card')){const active=c.dataset.card===state.route;c.setAttribute('aria-hidden',String(!active));c.inert=!active;c.classList.toggle('active',active)}
const near=$('.recorder-hit'),far=$('.settings-hit');near.dataset.route=setting?'todo_list':'r3v02_capture';near.setAttribute('aria-label',setting?'Todo 卡片':'录音卡片');far.dataset.route=setting?'r3v02_capture':'settings_sheet';far.setAttribute('aria-label',setting?'录音卡片':'设置卡片');far.innerHTML=icon(setting?'mic':'gear');content($('.todo-card .body-slot'),'todo');content($('.settings-card .body-slot'),'settings');const target=capture?$('.capture-dock'):setting?$('.settings-card'):$('.todo-card');target.append(footer);mountNav(capture?footer:target,capture);if(!capture)fold.hidden=true;
}else if(variant==='app03'){
const dock=$('.morph-dock');dock.append(footer);mountNav(capture?footer:dock,capture);content(dock.querySelector('.body-slot'),capture?'':setting?'settings':'todo');
}else if(variant==='app04'){
const track=$('.track'),n=routes.indexOf(state.route);content($('.todo-panel .body-slot'),'todo');content($('.settings-panel .body-slot'),'settings');
const tx=platform==='mobile'?(state.midpoint?-100/6:-n*100/3):setting?-100/3:0;track.style.transform=`translateX(${tx}%)`;$('.capture-panel').style.transform=platform==='macos'&&setting?'translateX(100%)':'';
for(const p of $$('.panel')){const r=p.classList.contains('capture-panel')?routes[0]:p.classList.contains('todo-panel')?routes[1]:routes[2];const active=r===state.route||(platform==='macos'&&r===routes[0])||(state.midpoint&&r===routes[0]);p.inert=!active;p.setAttribute('aria-hidden',String(!active))}
(platform==='mobile'?$('.pager-dock'):$('.capture-panel')).append(footer);mountNav(platform==='mobile'?footer:$('.desktop-nav'),platform==='mobile'&&capture);if(platform==='macos')fold.hidden=true;
}else{
const body=$('.reference-body');body.hidden=capture;body.querySelector('.heading').textContent=setting?'设置':'Todo';content(body.querySelector('.body-slot'),capture?'':setting?'settings':'todo');$('.dock').append(footer);mountNav(footer,true);
}
paint();}
function cancel(){if(!session)return;clearTimeout(timer);timer=null;session=null;state.phase='idle';state.notice='已取消';pointer=null;keyboard=null;paint()}
function select(route){if(!routes.includes(route))return;cancel();state.route=route;state.midpoint=false;state.fold=route!=='r3v02_capture';state.notice='';if(route==='settings_sheet'&&!state.expanded){state.expanded='model';invalidate()}render();requestAnimationFrame(()=>{const b=nav.querySelector(`[data-route="${route}"]`);if(!nav.hidden)b.focus({preventScroll:true});else fold.focus({preventScroll:true})})}
function begin(intent){if(session||state.route==='settings_sheet')return false;session={intent,model:state.model,destination:state.destination};state.phase='listening';state.notice='正在录音';paint();return true}
function release(){if(!session||state.phase!=='listening')return;const current=session;state.phase='refining';state.notice='正在整理';paint();timer=setTimeout(()=>{if(session!==current)return;timer=null;session=null;state.phase='done';const refined=current.model==='精炼演示';state.sentence=refined?'明天整理想法，留出专注时间。':'明天留出时间整理想法。';if(current.intent==='todo'||current.destination==='Todo'){state.items.push(refined?'整理想法，留出专注时间':'留出时间整理想法');state.done.push(false);state.route='todo_list';state.midpoint=false;state.fold=true;state.notice='已补充 1 项待办';invalidate()}else state.notice='已整理完成';render()},360)}
// Keep the physical target mounted throughout Listening and Refining; only paint its state.
hold.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();if(begin(state.route==='todo_list'?'todo':'capture')){pointer=e.pointerId;hold.setPointerCapture(pointer)}});
hold.addEventListener('pointerup',e=>{if(pointer!==e.pointerId)return;if(!hold.hasPointerCapture(e.pointerId)){cancel();return}pointer=null;release()});hold.addEventListener('pointercancel',cancel);hold.addEventListener('lostpointercapture',()=>{if(pointer!==null)cancel()});
hold.addEventListener('click',e=>{if(e.detail===0&&begin(state.route==='todo_list'?'todo':'capture'))release()});
// A release not delivered to the captured target must cancel, never leave a live session.
function cancelUnreleased(){if(session&&state.phase==='listening'&&keyboard===null)cancel()}
window.addEventListener('pointerup',cancelUnreleased);window.addEventListener('mouseup',cancelUnreleased);window.addEventListener('pointercancel',cancel);
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b===hold)return;if(b.dataset.route)select(b.dataset.route);else if(b===fold){cancel();if(variant==='app01'&&platform==='mobile'&&state.route!=='r3v02_capture')select('r3v02_capture');else{state.fold=!state.fold;render()}}
else if(b.dataset.todo!==undefined){const i=Number(b.dataset.todo);state.done[i]=!state.done[i];state.notice=state.done[i]?'已完成一项':'已恢复一项';invalidate();render()}
else if(b.dataset.setting){state.expanded=state.expanded===b.dataset.setting?'':b.dataset.setting;invalidate();render()}
else if(b.dataset.model){state.model=b.dataset.model;state.notice='下一段使用'+state.model;invalidate();render()}
else if(b.dataset.destination){state.destination=b.dataset.destination;state.notice=state.destination==='Todo'?'录音完成后补充待办':'录音完成后保留句子';invalidate();render()}
else if(b.hasAttribute('data-clear')){state.clear=!state.clear;state.notice=state.clear?'已增加玻璃底色':'已恢复系统透明度';invalidate();render()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel();return}if(e.code==='Space'&&e.altKey){e.preventDefault();if(!e.repeat&&!keyboard&&begin(e.shiftKey?'todo':'capture'))keyboard=e.code}});window.addEventListener('keyup',e=>{if(e.code==='Space'&&(keyboard||e.altKey))e.preventDefault();if(e.code===keyboard){keyboard=null;release()}});window.addEventListener('blur',cancel);
if(variant==='app04'){
const wrap=$('.track-wrap');wrap.addEventListener('pointerdown',e=>{if(session||e.target.closest('button,.body-slot'))return;swipe={id:e.pointerId,x:e.clientX,y:e.clientY};wrap.setPointerCapture(e.pointerId)});wrap.addEventListener('pointermove',e=>{if(swipe&&Math.abs(e.clientY-swipe.y)>12)swipe=null});wrap.addEventListener('pointerup',e=>{if(!swipe)return;const dx=e.clientX-swipe.x;swipe=null;if(Math.abs(dx)>=48)select(routes[Math.max(0,Math.min(2,routes.indexOf(state.route)+(dx<0?1:-1)))])});wrap.addEventListener('pointercancel',()=>swipe=null);
}
function changePlatform(value){const next=normalize(value);if(!next||next===platform)return;cancel();platform=next;state.route=variant==='current'?'r3v02_capture':'todo_list';state.midpoint=variant==='app04';state.fold=true;document.body.dataset.platform=next;document.documentElement.dataset.platform=next;render()}
window.addEventListener('message',e=>{if(e.source!==parent&&e.source!==window)return;if(e.origin!==location.origin&&!(location.protocol==='file:'&&e.origin==='null'))return;const d=e.data||{};if(d.theme==='dark'||d.theme==='light')document.documentElement.dataset.theme=d.theme;changePlatform(d.platform)});
new MutationObserver(()=>changePlatform(document.body.dataset.platform!==platform?document.body.dataset.platform:document.documentElement.dataset.platform)).observe(document.body,{attributes:true,attributeFilter:['data-platform']});
new MutationObserver(()=>changePlatform(document.documentElement.dataset.platform)).observe(document.documentElement,{attributes:true,attributeFilter:['data-platform']});
render();
})();
</script></body></html>
