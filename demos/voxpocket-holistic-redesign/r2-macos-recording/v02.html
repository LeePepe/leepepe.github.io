document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b===primary||b.disabled)return;const a=b.dataset.action;if(busy()&&!['back'].includes(a))return;switch(a){case'workspace':workspace();break;case'back':workspace(false);break;case'history':s.historyOpen?hideHistory():showHistory();break;case'more':openMenu(b);break;case'close-menu':closeMenu();break;case'anchor':s.closed=!s.closed;render();break;case'intent-text':case'intent-todo':s.intent=a.slice(7);render();announce(`${s.intent} intent selected`);break;case'new':closeMenu();newCapture();break;case'copy':closeMenu();copy();break;case'failure':s.failNext=true;closeMenu();announce('Next refinement will be unavailable locally');break;case'route':s.route=s.route==='fallback'?'local':'fallback';s.failNext=false;b.textContent=s.route==='fallback'?'Refinement route · Local fallback':'Refinement route · Local sample';b.setAttribute('aria-pressed',String(s.route==='fallback'));break;case'retry':refine();break;case'pin':s.pinned=!s.pinned;s.retracted=!s.pinned;if(n===5){$('[data-compact-document]').hidden=!s.pinned;$('.orb-collar').classList.toggle('open',s.pinned)}render();announce(s.pinned?'Pinned in sample desktop':'Unpinned in sample desktop');break;case'select-history':selectHistory(Number(b.dataset.index));break;case'steps':s.task.open=!s.task.open;render();break;case'step-complete':check(Number(b.dataset.step));break;case'parent-complete':check(0,true);break;case'child':s.task.child=s.task.child===Number(b.dataset.step)?-1:Number(b.dataset.step);render();break;case'commands':s.commandOpen?closeCommands():openCommands();break;case'source':sourceRevisions();break;case'revision':{const r=cfg.recents[Number(b.dataset.index)];s.captureId=100+Number(b.dataset.index);s.raw=r[1];s.result=r[2]||r[1];s.mode='text';s.task=null;setPhase('Done');break}case'notes':s.collectionLens='notes';closeMenu();workspace(true);showHistory();break;case'schedule':{const p=el('p','Scheduling is local to this sample; no date has been assigned.');b.after(p);b.disabled=true;break}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-command]');if(b&&!b.disabled)chooseCommand(Number(b.dataset.command))});
$('.command-input')?.addEventListener('input',()=>{s.commandIndex=0;openCommands()});
function key(e){if(e.key==='Escape'){e.preventDefault();escape();return}if(e.altKey&&e.code==='Space'){e.preventDefault();if(!e.repeat&&!busy()){start(e.shiftKey?'todo':'text','keyboard')}return}if(e.metaKey&&e.key==='Enter'){e.preventDefault();if(n===2&&s.phase==='Done'&&s.mode==='text'){commit();workspace(true)}else workspace(true);return}if(e.metaKey&&e.key==='['){e.preventDefault();workspace(false);return}if(e.metaKey&&e.key.toLowerCase()==='z'&&!busy()){e.preventDefault();undo();return}
if(e.metaKey&&e.key.toLowerCase()==='c'&&(doc===document.activeElement||doc.contains(document.activeElement))&&s.phase==='Done'&&!getSelection()?.toString()){e.preventDefault();copy();return}
if(e.metaKey&&e.key.toLowerCase()==='k'&&n===9){e.preventDefault();$$('.command-matrix button')[lastCell].focus();return}
if(e.metaKey&&e.key.toLowerCase()==='j'&&n===3){e.preventDefault();s.commandOpen?closeCommands():openCommands();return}
if(e.metaKey&&e.shiftKey&&((n===2&&e.key.toLowerCase()==='d')||(n===4&&e.key.toLowerCase()==='m')||(n===5&&e.key.toLowerCase()==='r')||(n===7&&e.key.toLowerCase()==='u')||(n===10&&e.key.toLowerCase()==='l'))){e.preventDefault();if(busy())return;if(n===2)workspace();else if(n===4){s.closed=!s.closed;render()}else if(n===5){s.pinned=!s.pinned;s.retracted=!s.pinned;$('[data-compact-document]').hidden=!s.pinned;$('.orb-collar').classList.toggle('open',s.pinned)}else s.historyOpen?hideHistory():showHistory();return}
if(e.metaKey&&e.altKey&&e.key.toLowerCase()==='r'&&n===6){e.preventDefault();if(!busy())sourceRevisions();return}
if(e.metaKey&&e.key.toLowerCase()==='e'&&n===6){e.preventDefault();doc.focus();return}
if(e.metaKey&&e.key.toLowerCase()==='l'&&n===8){e.preventDefault();$('.sample-paper').focus();return}
if(e.metaKey&&e.altKey&&e.key.toLowerCase()==='p'&&n===8){e.preventDefault();if(!busy()){s.pinned=!s.pinned;render();announce(s.pinned?'Pinned in sample desktop':'Unpinned in sample desktop')}return}
if(n===6&&e.target.closest('[data-source-revisions]')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const rows=$$('[data-source-revisions] button'),i=rows.indexOf(document.activeElement);rows[(i+(e.key==='ArrowDown'?1:rows.length-1))%rows.length].focus();return}
const rows=historyNode()?.querySelectorAll('[data-index]');if(s.historyOpen&&rows?.length&&(historyNode().contains(document.activeElement))){if(n===4&&e.metaKey&&e.altKey&&/^[123]$/.test(e.key)){e.preventDefault();selectHistory(Number(e.key)-1,true);return}const forward=n===7?'ArrowRight':'ArrowDown',backward=n===7?'ArrowLeft':'ArrowUp';if([forward,backward].includes(e.key)){e.preventDefault();historyCursor=(historyCursor+(e.key===forward?1:-1)+rows.length)%rows.length;rows.forEach((b,i)=>{b.setAttribute('aria-selected',String(i===historyCursor));b.tabIndex=i===historyCursor?0:-1});rows[historyCursor].focus();return}if(e.key==='Enter'){e.preventDefault();selectHistory(historyCursor);return}}
if(n===3&&s.commandOpen&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();const rows=$$('[data-command]').filter(x=>!x.hidden&&!x.disabled);if(e.key==='Enter'){const selected=rows[s.commandIndex%Math.max(1,rows.length)];if(selected)chooseCommand(Number(selected.dataset.command))}else{s.commandIndex=(s.commandIndex+(e.key==='ArrowDown'?1:-1)+Math.max(1,rows.length))%Math.max(1,rows.length);filterCommands()}return}
if(n===9&&e.target.closest('.command-matrix')){const cells=$$('.command-matrix button');let i=cells.indexOf(document.activeElement);if(['Home','End','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='Home')i=0;else if(e.key==='End')i=5;else if(s.expanded){if(e.key==='ArrowDown')i=(i+1)%6;if(e.key==='ArrowUp')i=(i+5)%6}else{i=(i+({ArrowLeft:5,ArrowRight:1,ArrowUp:3,ArrowDown:3}[e.key]))%6}cells.forEach((c,j)=>c.tabIndex=j===i?0:-1);lastCell=i;cells[i].focus();return}}
if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.matches('[data-action="steps"],[data-action="child"]')){e.preventDefault();if(e.target.dataset.action==='steps')s.task.open=e.key==='ArrowRight';else s.task.child=e.key==='ArrowRight'?Number(e.target.dataset.step):-1;render();return}
if(e.key==='Enter'&&document.activeElement===doc&&s.phase==='Done'&&[1,3,5,7,9].includes(n)){e.preventDefault();commit();return}
if(n===1&&e.key==='ArrowDown'&&e.target.matches('[data-action="history"]')){e.preventDefault();doc.focus();return}if(n===1&&e.key==='ArrowUp'&&e.target===doc){e.preventDefault();primary.focus();return}
if(n===8&&['PageDown','PageUp'].includes(e.key)&&e.target.closest('.sample-paper')){e.preventDefault();$('.sample-paper').scrollTop+=e.key==='PageDown'?180:-180;return}
const menu=$('[data-menu]');if(menu&&e.key==='Tab'){const buttons=[...menu.querySelectorAll('button:not(:disabled)')];const i=buttons.indexOf(document.activeElement);if((e.shiftKey&&i===0)||(!e.shiftKey&&i===buttons.length-1)){e.preventDefault();buttons[e.shiftKey?buttons.length-1:0].focus()}}
}
window.addEventListener('keydown',key);window.addEventListener('keyup',e=>{if(e.code==='Space'&&s.keyboard){e.preventDefault();finish()}});
window.addEventListener('blur',()=>{body.dataset.focus='false';cancel(false)});window.addEventListener('focus',()=>body.dataset.focus='true');document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel(false)});
$('.sample-paper')?.addEventListener('scroll',()=>{if(!s.pinned)body.style.setProperty('--cue-shift',`${-Math.min(48,$('.sample-paper').scrollTop/4)}px`)});
if(n===5)primary.addEventListener('contextmenu',e=>{e.preventDefault();openMenu(primary)});
function theme(value){if(!['light','dark'].includes(value))return;root.dataset.theme=value;body.dataset.theme=value;}
function platform(value){if(!['macos','desktop','mobile'].includes(value))return;root.dataset.platform=value;body.dataset.platform=value;}
new MutationObserver(records=>{const changed=records.filter(r=>r.attributeName==='data-theme');if(changed.length){const target=changed[changed.length-1].target;const value=target.dataset.theme;if(['light','dark'].includes(value)&&(body.dataset.theme!==value||root.dataset.theme!==value))theme(value)}}).observe(root,{attributes:true,subtree:true,attributeFilter:['data-theme']});
window.addEventListener('message',e=>{if(e.source!==window.parent||!((e.origin===location.origin&&e.origin!=='null')||(location.protocol==='file:'&&e.origin==='null')))return;const d=e.data;if(!d||typeof d!=='object'||Array.isArray(d))return;theme(d.theme);platform(d.platform)});
theme(root.dataset.theme);platform(root.dataset.platform);body.dataset.focus='true';
if(n===9){const cells=$$('.command-matrix button');cells.forEach((b,i)=>{b.tabIndex=i===0?0:-1;b.addEventListener('focus',()=>{lastCell=i;cells.forEach((c,j)=>c.tabIndex=j===i?0:-1)})})}
render();
})();
</script></body></html>
