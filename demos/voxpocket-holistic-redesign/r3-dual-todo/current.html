  const previewTrack=node('div','preview-track'), previewInner=node('div','track-inner'), previewCopy=node('p','preview-copy',''); previewTrack.id=record.id+'-preview'; previewTrack.setAttribute('aria-hidden','true'); previewInner.append(previewCopy); previewTrack.append(previewInner);
  const drawerTrack=node('div','drawer-track'), drawerInner=node('div','track-inner'), drawer=node('div','drawer'); drawerTrack.id=record.id+'-drawer'; drawerTrack.setAttribute('aria-hidden','true'); drawer.inert=true;
  const steps=node('ol','steps'); steps.setAttribute('aria-label','AI 子任务');
  const fields=node('fieldset'), legend=node('legend','','调整待办'); fields.append(legend);
  const statusControl=selection('状态',[['todo','待处理'],['inprogress','进行中'],['done','已完成']]); statusControl.select.className='status-edit';
  const priorityControl=selection('优先级',[['P0','P0'],['P1','P1'],['P2','P2']]); priorityControl.select.className='priority-edit'; fields.append(statusControl.label,priorityControl.label);
  const tagGroup=node('div','wide'), tagLabel=node('label','','标签 / 区域'), tagEditor=node('div','tag-editor');
  const tagRemovers=[button('',''),button('',''),button('','')]; tagEditor.append(...tagRemovers);
  const tagEntry=node('div','tag-entry'), tagInput=node('input'); tagInput.type='text'; tagInput.maxLength=40; tagInput.setAttribute('aria-label','新标签'); tagInput.placeholder='添加标签'; const tagAdd=button('','添加'); tagEntry.append(tagInput,tagAdd); tagLabel.append(tagEntry);
  const tagError=node('p','error',''); tagError.setAttribute('role','status'); tagGroup.append(tagEditor,tagLabel,tagError); fields.append(tagGroup);
  const timeLabel=node('label','wide','时间'), timeEdit=node('input'); timeEdit.type='text'; timeEdit.setAttribute('aria-label','待办时间'); timeEdit.inputMode='text'; const timeError=node('p','error',''); timeError.setAttribute('role','status'); timeLabel.append(timeEdit,timeError); fields.append(timeLabel);
  const exports=node('div','exports'), linear=button('','一键转 Linear Issue'), copy=button('','复制 Markdown'); exports.append(linear,copy);
  const receipt=node('p','receipt',''), objectPreview=node('pre','issue-object',''), copyPreview=node('pre','markdown-preview',''); receipt.setAttribute('role','status'); objectPreview.hidden=true; copyPreview.hidden=true; copyPreview.tabIndex=0; objectPreview.setAttribute('aria-label','Linear Issue 结构'); copyPreview.setAttribute('aria-label','可选择的 Markdown');
  drawer.append(steps,fields,exports,receipt,objectPreview,copyPreview); drawerInner.append(drawer); drawerTrack.append(drawerInner); row.append(summary,previewTrack,drawerTrack); stream.append(row);
  const view={row,summary,status,statusRing,statusLabel,priority,title,peek,tagSlots,time,previewTrack,previewCopy,drawerTrack,drawer,steps,statusEdit:statusControl.select,priorityEdit:priorityControl.select,tagRemovers,timeEdit,receipt,objectPreview,copyPreview}; views.set(record.id,view);
  seedSteps.forEach(step=>addStep(record,step)); refreshFields(record);
  title.addEventListener('click',()=>toggleRecord(record)); status.addEventListener('click',()=>setStatus(record,['todo','inprogress','done'][(['todo','inprogress','done'].indexOf(record.status)+1)%3]));
  peek.addEventListener('click',()=>{cancelCapture(); if(previewId===record.id)hidePreview(); else showPreview(record);});
  [title,peek].forEach(trigger=>{
    trigger.addEventListener('pointerenter',event=>{
      if(event.pointerType!=='mouse'||performance.now()<suppressMouseUntil||captureSession)return;
      if(inputMode!=='mouse')hidePreview(); inputMode='mouse';
      clearTimeout(dwellTimer); const epoch=++previewEpoch; dwellTimer=setTimeout(()=>{if(epoch===previewEpoch)showPreview(record);},160);
    });
    trigger.addEventListener('pointerleave',()=>{clearTimeout(dwellTimer); previewEpoch++;});
    trigger.addEventListener('focus',()=>{if(inputMode==='keyboard')showPreview(record);});
  });
  row.addEventListener('pointerenter',()=>clearTimeout(hideTimer));
  row.addEventListener('pointerleave',event=>{if(event.pointerType!=='mouse'||performance.now()<suppressMouseUntil)return; clearTimeout(dwellTimer); const epoch=++previewEpoch; hideTimer=setTimeout(()=>{if(epoch===previewEpoch&&previewId===record.id)hidePreview();},100);});
  row.addEventListener('focusout',event=>{if(!row.contains(event.relatedTarget))hidePreview();});
  statusControl.select.addEventListener('change',()=>setStatus(record,statusControl.select.value));
  priorityControl.select.addEventListener('change',()=>{cancelCapture(); clearUndo(); record.priority=priorityControl.select.value; refreshFields(record); say('优先级已更新');});
  tagRemovers.forEach((b,i)=>b.addEventListener('click',()=>{cancelCapture(); clearUndo(); record.tags.splice(i,1); text(tagError,''); refreshFields(record);}));
  function addTag() {
    cancelCapture(); const value=tagInput.value.trim().replace(/^#+/,'');
    if(record.tags.length>=3) {text(tagError,'最多 3 个标签'); return;}
    if(!value || /\s/.test(value)) {text(tagError,'请填写不含空格的标签'); return;}
    if(record.tags.includes(value)) {text(tagError,'此标签已存在'); return;}
    clearUndo(); record.tags.push(value); tagInput.value=''; text(tagError,''); refreshFields(record);
  }
  tagAdd.addEventListener('click',addTag); tagInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();addTag();}});
  timeEdit.addEventListener('change',()=>{
    cancelCapture(); const value=timeEdit.value.trim();
    if(!/^(今天|明天|昨天|本周[一二三四五六日]) ([01]\d|2[0-3]):[0-5]\d$/.test(value)) {timeEdit.value=record.time; text(timeError,'请输入有效时间，例如 明天 11:00'); timeEdit.setAttribute('aria-invalid','true'); return;}

  });
  copy.addEventListener('click',async()=>{

    try { if(!navigator.clipboard?.writeText)throw new Error('unavailable'); await navigator.clipboard.writeText(payload); text(receipt,'已复制 Markdown（演示数据）'); }

  });
}
function cancelCapture() {
  if(captureSession) { clearTimeout(captureSession.timer); captureSession=null; sessionNumber++; }
  captureLabel.firstChild.data='按住补充或新建'; captureButton.setAttribute('aria-label','按住补充或新建'); cancelButton.hidden=true; root.dataset.capture='idle'; invalidatePreview();
}
function beginCapture(kind,pointerId) {
  if(captureSession)return;
  hidePreview(); const session={number:++sessionNumber,kind,pointerId,accepted:false,target:null}; captureSession=session;
  session.timer=setTimeout(()=>{
    if(captureSession!==session||session.number!==sessionNumber)return;
    session.accepted=true; session.target=expandedId; session.title=session.target?records.find(record=>record.id===session.target).title:null;
    const label=session.target?`🎙️ 正在继续补充至：${session.title}`:'🎙️ 正在新建语音待办…'; text(captureLabel,label); captureButton.setAttribute('aria-label',label); cancelButton.hidden=false; root.dataset.capture='holding';
  },180);
}
function finishCapture(kind,pointerId) {
  const session=captureSession;
  if(!session||session.kind!==kind||(kind==='pointer'&&session.pointerId!==pointerId))return;
  const valid=session.accepted && session.number===sessionNumber && session.target===expandedId;
  cancelCapture();
  if(!valid)return;
  if(session.target) {const record=records.find(record=>record.id===session.target); addStep(record,'核对反馈分类是否齐全'); say('已补充 1 个步骤');}
  else {
    const record={id:'demo-'+String(records.length+1).padStart(2,'0'),status:'todo',priority:'P1',title:'整理晨光示例清单',tags:['AI'],time:'明天 11:00',steps:['收集示例条目','合并重复项','排好清单顺序']};
    records.push(record); mountRecord(record); requestAnimationFrame(()=>views.get(record.id).row.scrollIntoView({block:'end',behavior:'instant'})); say('已新建待办');
  }
}
captureButton.addEventListener('pointerdown',event=>{if(event.button!==0)return; event.preventDefault(); captureButton.focus({preventScroll:true}); captureButton.setPointerCapture(event.pointerId); beginCapture('pointer',event.pointerId);});
captureButton.addEventListener('pointermove',event=>{
  if(!captureSession||captureSession.kind!=='pointer')return;
  const box=captureButton.getBoundingClientRect(); if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)cancelCapture();
});
captureButton.addEventListener('pointerup',event=>finishCapture('pointer',event.pointerId));
captureButton.addEventListener('pointercancel',cancelCapture); captureButton.addEventListener('touchcancel',cancelCapture); captureButton.addEventListener('lostpointercapture',()=>{if(captureSession?.kind==='pointer')cancelCapture();});
captureButton.addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault(); if(!event.repeat)beginCapture('keyboard');}});
captureButton.addEventListener('keyup',event=>{if(event.code==='Space'){event.preventDefault();finishCapture('keyboard');}});
captureButton.addEventListener('blur',event=>{if(event.relatedTarget!==cancelButton)cancelCapture();}); cancelButton.addEventListener('click',()=>{cancelCapture();captureButton.focus({preventScroll:true});});
document.querySelector('#undo').addEventListener('click',()=>{
  if(!undoSnapshot)return; const saved=undoSnapshot, record=records.find(record=>record.id===saved.id); clearUndo(); record.status=saved.status; record.steps.forEach((step,i)=>{if(i<saved.checks.length){step.checked=saved.checks[i];updateStep(step);}}); refreshFields(record); refreshPreview(record); say('已撤销完成');
});
document.addEventListener('pointerdown',event=>{
  if(inputMode!==event.pointerType)hidePreview();
  inputMode=event.pointerType; if(event.pointerType==='touch')suppressMouseUntil=performance.now()+900;
  if(!captureButton.contains(event.target)&&!cancelButton.contains(event.target)&&captureSession)cancelCapture();
  if(previewId&&!views.get(previewId).row.contains(event.target))hidePreview();
},true);
document.addEventListener('keydown',event=>{
  if(inputMode!=='keyboard')invalidatePreview();
  inputMode='keyboard';
  if(event.key!=='Escape')return;
  event.preventDefault();
  if(captureSession){cancelCapture();return;}
  if(previewId){hidePreview();return;}
  if(expandedId){const v=views.get(expandedId); setExpanded(v,false); expandedId=null; v.title.focus({preventScroll:true}); hidePreview(); say('已收起待办');}
});
main.addEventListener('scroll',hidePreview,{passive:true});
window.addEventListener('blur',()=>{cancelCapture();hidePreview();}); window.addEventListener('pagehide',()=>{cancelCapture();hidePreview();});
window.addEventListener('message',event=>{
  if(window.parent===window||event.source!==window.parent)return;
  const localFileParent=location.protocol==='file:'&&event.origin==='null';
  if(event.origin!==location.origin&&!localFileParent)return;
  const data=event.data; if(!data||typeof data!=='object'||Array.isArray(data))return;
  if(data.theme!==undefined&&!['light','dark'].includes(data.theme))return;
  if(data.platform!==undefined&&!['mobile','desktop','macos'].includes(data.platform))return;
  if(data.theme===undefined&&data.platform===undefined)return;
  cancelCapture(); hidePreview(); if(data.theme)root.dataset.theme=data.theme; if(data.platform)root.dataset.platform=data.platform==='macos'?'desktop':data.platform;
});
function textScale() { root.dataset.largeText=String(parseFloat(getComputedStyle(root).fontSize)>=28); }
new ResizeObserver(textScale).observe(root); new MutationObserver(textScale).observe(root,{attributes:true,attributeFilter:['style']}); textScale();
records.forEach(mountRecord);
