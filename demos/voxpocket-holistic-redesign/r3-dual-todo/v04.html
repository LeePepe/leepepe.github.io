function path(key){const choices={complete:['Complete','Completion'],voice:['Voice'],run:['Runner play','Run','Runner'],close:['Close'],fold:['Fold pocket','Branch disclosure','Pocket','Margin index','Horizon disclosure','Fold']};return (choices[key]||[key]).map(k=>D.icons[k]).find(Boolean)||Object.values(D.icons)[0]}
function svg(key,ring=false){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${D.n===6?'1.6':D.n===2?'1.65':'1.7'}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ring?'<circle cx="12" cy="12" r="10"/>':''}<path ${ring?'class="tick"':''} d="${path(key)}"/></svg>`}
const button=(a,t,attrs='')=>`<button type="button" data-action="${a}" ${attrs}>${t}</button>`;
const hero={id:'focus',title:D.hero,status:'pending',children:[],notes:'本地示例笔记 · 只保留这一件的下一步。',project:'VP',horizon:'now'};
const retainedRows=new Set();
const tasks=D.siblings.map((title,i)=>({id:`s${i+1}`,title,status:(D.n===4||D.n===5)?['pending','pending','running','done'][i]:D.n===7?['pending','running','done','pending'][i]:['pending','running','done'][i],children:[],notes:`${title} · 本地合成笔记，无外部资源。`,project:D.n===7?['VP','AI','Personal','AI'][i]:'VP',horizon:D.n===8?(i===2?'week':'later'):'later',collection:D.n===5&&i===3?'archive':'today'}));
const state={filter:D.initialFilter,pocket:false,card:'focus',project:'VP',horizon:null,branch:true,mode:'morning',selected:null,tab:'steps',route:'todo',expanded:false,undo:null,undoTimer:null,voiceExposed:false,capture:{phase:'idle'},runners:new Map(),accepted:new Set()};
let originFocus=null,menuOrigin=null,restoreSettings=null,session=0,captureTimer=null,holdTimer=null,activePointer=null,holdStarted=false,ignoreClick=false,keyboardHeld=false;
const get=id=>[hero,...tasks].flatMap(t=>[t,...t.children]).find(t=>t.id===id);
const say=t=>{q('.live').textContent=t};
const matching=t=>state.filter==='all'||t.status===state.filter;
const belongs=(t,key)=>key==='all'||(D.n===7?t.project===key:D.n===8?t.horizon===key:t.collection===key);
function placeUndo(){
 if(!state.undo||undoEl.hidden){if(!undoEl.isConnected)body.append(undoEl);return}
 const t=get(state.undo.id);if(!t)return;
 const visible=el=>el&&el.getClientRects().length&&!el.closest('[hidden]');
 let mount=state.selected===t.id&&!detail.hidden?q('.detail-content'):null;
 if(!mount&&t.id==='focus')mount=body.classList.contains('large-type')?qa('[data-hero]').find(visible):qa('[data-hero-ring]').find(visible);
 if(!mount){const row=qa('.task').find(el=>el.dataset.id===t.id&&visible(el));mount=row?.parentElement}
 if(!mount)mount=qa('[data-list]').find(el=>visible(el)&&belongs(t,el.dataset.list))||qa('[data-list]').find(visible);
 if(mount){mount.append(undoEl);undoEl.querySelector('button').setAttribute('aria-label',`撤销 ${t.title} 的完成状态`)}else if(!undoEl.isConnected)body.append(undoEl)
}
function completion(t){return button('complete',svg('complete',true),`class="check" data-id="${t.id}" aria-pressed="${t.status==='done'}" aria-label="${t.status==='done'?'重新打开':'完成'} ${esc(t.title)}"`)}
function taskHTML(t,child=false,index=0){const locator=state.selected===t.id&&(D.n===9||D.n===10);return `<div class="task ${state.selected===t.id?'selected':''} ${locator?'locator':''}" data-id="${t.id}" data-status="${t.status}">${child&&D.n===3?`<span class="node-number">${index+1}</span>`:''}${locator?'':completion(t)}${button('select',`<span class="task-title">${locator?'正在查看':esc(t.title)}</span><span class="task-status">${labels[t.status]}${state.runners.get(t.id)?.phase==='running'?' · 演示执行中':''}</span>`,`class="task-body" data-id="${t.id}"` )}</div>`}
function preserveFocus(fn){const a=document.activeElement,token=a?.dataset?.action,id=a?.dataset?.id,inside=!!a?.closest('.tasks,.detail-content,[data-hero-ring]');fn();if(inside&&token){const target=qa(`[data-action="${token}"]`).find(b=>b.dataset.id===id&&!b.closest('[hidden]')&&b.getClientRects().length);(target||qa('.tasks button,.empty button').find(b=>b.getClientRects().length))?.focus({preventScroll:true})}}
function renderLists(){qa('[data-list]').forEach(el=>{const key=el.dataset.list,scroll=el.scrollTop;const items=tasks.filter(t=>belongs(t,key)&&(matching(t)||retainedRows.has(t.id)));el.innerHTML=items.map(t=>taskHTML(t)).join('')||`<div class="empty">${D.n===9?'没有匹配项':'这一栏暂时空着'}${button('clear-filter',D.n===4?'回到待处理':'查看全部')}</div>`;el.scrollTop=scroll});qa('[data-count]').forEach(el=>{const key=el.dataset.count;const prefixes={all:D.n===1?'收件箱':D.n===3?'其他待办':D.n===6?'余下':'Todo List',today:'今日',archive:'归档',later:'今天稍后',week:'本周灵感'};el.textContent=`${prefixes[key]} · ${tasks.filter(t=>belongs(t,key)&&matching(t)).length}`});qa('[data-lane-count]').forEach(el=>el.textContent=tasks.filter(t=>t.project===el.dataset.laneCount&&matching(t)).length);qa('[data-filter-label]').forEach(el=>el.textContent=labels[state.filter]);qa('[data-action=status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===state.filter)));qa('.lane').forEach(el=>el.classList.toggle('active',el.dataset.project===state.project));qa('[data-action=project]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.project===state.project)));if(D.n===7)q('[data-accessory] .voice-label').textContent=`语音加入 ${state.project}`;placeUndo()}
function renderHero(){qa('[data-hero]').forEach(el=>{el.classList.toggle('completed',hero.status==='done');const title=el.querySelector('.hero-title');if(title)title.textContent=hero.title;const r=el.querySelector('[data-hero-ring]');if(r)r.innerHTML=completion(hero)});if(D.n===9){const box=q('[data-master-focus]');box.innerHTML=state.selected==='focus'?button('select','当前焦点 · 白帆提纲', 'class="focus-locator" data-id="focus"'):`<section class="hero ${hero.status==='done'?'completed':''}" data-hero><h1>${button('select-hero',esc(hero.title),'class="hero-title"')}</h1><div data-hero-ring>${completion(hero)}</div><p class="scope">焦点 · 不随筛选隐藏</p></section>`}}
function renderBranch(){if(D.n!==3)return;const el=q('[data-branch]');el.innerHTML=!state.branch?button('branch',`${hero.children.length} 步 · 展开分支`):hero.children.length?hero.children.map((t,i)=>taskHTML(t,true,i)).join(''):`<div class="placeholder">意图还没有拆解</div>${button('decompose','拆成三步','class="text-action" data-id="focus"')}`;body.classList.toggle('branch-collapsed',!state.branch);q('[data-action=branch]').setAttribute('aria-expanded',String(state.branch));placeUndo()}
function setPocket(open){state.pocket=open;body.classList.toggle('pocket-open',open);qa('[data-action=fold]').forEach(b=>b.setAttribute('aria-expanded',String(open)));if(D.n===1){q('.inbox').classList.toggle('open',open);q('.inbox-content').hidden=!open}if(D.n===3){q('.root-list').hidden=!open;if(open)state.branch=false;renderBranch()}if(D.n===6){q('.remaining-list').hidden=!open;q('.editorial-disclosure').setAttribute('aria-expanded',String(open))}}
function setCard(card){state.card=card;body.dataset.cardActive=card;q('.card-stack').dataset.cardActive=card;q('[data-action=collapse-deck]').hidden=card==='focus';qa('[data-action=card]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.card===card)));const a=q('.active-card');a.hidden=card==='focus';if(card!=='focus'){q('[data-card-title]').textContent=card==='today'?'今日':'归档';q('[data-card-list]').innerHTML=`<div class="tasks" data-list="${card}"></div>`;renderLists()}}
function setHorizon(h){retainedRows.clear();state.horizon=h;body.classList.toggle('horizon-later',h==='later');body.classList.toggle('horizon-week',h==='week');qa('[data-horizon]').forEach(b=>{b.setAttribute('aria-expanded',String(b.dataset.horizon===h));b.parentElement.querySelector('.horizon-list').hidden=b.dataset.horizon!==h});renderLists()}
function updateInert(){const modal=!!state.selected&&innerWidth<D.breakpoint,settings=!q('.settings').hidden;workspace.inert=modal||settings;q('.record-home').inert=settings;detail.inert=settings;q('.sheet-veil').hidden=!modal;detail.setAttribute('role',modal?'dialog':'complementary');if(modal)detail.setAttribute('aria-modal','true');else detail.removeAttribute('aria-modal')}
function render(){preserveFocus(()=>{renderHero();renderLists();renderBranch();if(state.selected)renderDetail();placeUndo()});updateInert()}
function selectedRecord(){return get(state.selected)}
function assignment(t){if(D.n===7)return `<label class="scope-menu">项目 <select data-assignment="project" aria-label="任务项目">${['VP','AI','Personal'].map(p=>`<option ${t.project===p?'selected':''}>${p}</option>`).join('')}</select></label>`;if(D.n===8)return `<label class="scope-menu">时间范围 <select data-assignment="horizon" aria-label="任务时间范围">${[['now','Now'],['later','Later'],['week','Week']].map(([v,p])=>`<option value="${v}" ${t.horizon===v?'selected':''}>${p}</option>`).join('')}</select></label>`;return ''}
function panelHTML(t){if(state.tab==='steps'){return `${t.children.length?`<ol data-child-list>${t.children.map(c=>`<li data-child-id="${c.id}">${completion(c)}<span class="child-label">${esc(c.title)}</span></li>`).join('')}</ol><p class="scope">${t.children.filter(c=>c.status==='done').length} / 3 步完成 · 整项仍由你决定</p>`:'<p class="muted">还没有行动步骤</p>'}${button('decompose','语音拆解',`class="text-action" data-id="${t.id}"`)}${t.children.length===3&&t.children.every(c=>c.status==='done')?button('complete-parent','完成整项',`data-id="${t.id}"`):''}`}
if(state.tab==='notes')return `<p data-note-content>${esc(t.notes||'这是一条本地合成的行动笔记。')}</p>${assignment(t)}${(t.status==='done'||t.completionBefore!==undefined)?button('reopen',t.completionBefore!==undefined?'撤销完成变更':'重新打开',`data-id="${t.id}"`):''}`;
const run=state.runners.get(t.id)||{phase:'idle',step:0};return `<p class="muted">${D.n===7?'Herdr · 模拟调度 / Claude · 模拟执行':'本地演示执行'}</p><output class="runner-status" data-runner-status>${runnerText(run)}</output><div class="runner-progress"><span style="width:${run.step/3*100}%"></span></div>${t.children.length===3?`<div class="runner-controls">${button('run',svg('run')+'运行三步',`data-id="${t.id}"`)}${button('stop','停止',`data-id="${t.id}"`)}${button('resume','继续',`data-id="${t.id}"`)}${button('retry','重试',`data-id="${t.id}"`)}</div>${button('runner-menu','执行选项',`data-id="${t.id}" aria-haspopup="menu"`)}`:`<p class="muted">先生成三步，再明确开始执行。</p>${button('decompose','语音拆解',`class="text-action" data-id="${t.id}"`)}`}`}
function renderDetail(){const t=selectedRecord();if(!t)return;const content=q('.detail-content'),scroll=content.scrollTop;content.innerHTML=`${D.n===8?button('inspector-week','本周灵感', 'class="scope-menu"'):''}<div class="detail-title-row ${t.id==='focus'&&D.n===9?'focus-record':''}"><h2 data-detail-title>${t.id==='focus'&&D.n!==9?'当前焦点':esc(t.title)}</h2>${t.id==='focus'&&D.n!==9?'':completion(t)}</div>${!matching(t)&&t.id!=='focus'?'<p class="scope">已不在当前筛选</p>':''}<nav class="detail-tabs" role="tablist" aria-label="详情面板">${[['steps','步骤'],['notes','笔记'],['runner','执行']].map(([v,label])=>button('tab',label,`data-tab="${v}" role="tab" aria-selected="${state.tab===v}" tabindex="${state.tab===v?'0':'-1'}" id="tab-${v}" aria-controls="detail-panel"`)).join('')}</nav><section class="detail-panel" id="detail-panel" role="tabpanel" aria-labelledby="tab-${state.tab}">${panelHTML(t)}</section>${(t.status==='done'||t.completionBefore!==undefined)&&state.tab!=='notes'?button('reopen',t.completionBefore!==undefined?'撤销完成变更':'重新打开',`data-id="${t.id}"`):''}${D.n===5&&t.status==='done'&&t.collection!=='archive'?button('archive-task','收入口袋',`data-id="${t.id}"`):''}`;content.scrollTop=scroll;updateRunnerControls();placeUndo();}
function openDetail(id,origin){if(!get(id))return;closeMenu();if(state.capture.phase!=='idle'&&state.capture.target!==id){state.capture.pendingSelection=id;renderCapture('先放弃当前语音草稿，再切换待办。');return}originFocus=origin||document.activeElement;state.selected=id;state.tab='steps';detail.hidden=false;detail.classList.toggle('expanded',state.expanded);body.classList.add('detail-open');if(D.n===9)detail.append(q('[data-accessory]'));render();q('[data-action=close]').focus({preventScroll:true});say(`查看 ${get(id).title}`)}
function closeDetail(){const id=state.selected;state.selected=null;detail.hidden=true;body.classList.remove('detail-open');if(D.n===9)workspace.append(q('[data-accessory]'));render();q('.inspector-empty')?.toggleAttribute('hidden',innerWidth<900);const target=qa('[data-action=select]').find(b=>b.dataset.id===id&&b.getClientRects().length)||q('[data-action=select-hero]')||originFocus;target?.focus({preventScroll:true})}
function setFilter(filter){if(!(filter in labels))return;state.filter=filter;retainedRows.clear();closeMenu();render();const item=qa('.tasks button').find(b=>b.getClientRects().length);if(!document.activeElement||document.activeElement===body)item?.focus({preventScroll:true});say(`${labels[filter]} · ${tasks.filter(matching).length} 项`)}
function closeMenu(){qa('.filter-menu,.context-menu').forEach(el=>el.remove());qa('[data-action=filter],[data-action=lens-menu]').forEach(b=>b.setAttribute('aria-expanded','false'));if(D.n===6&&innerWidth<960){q('.margin-index').hidden=true;q('[data-action=index]').setAttribute('aria-expanded','false')}}
function menuAt(buttonEl,html,cls='context-menu'){closeMenu();const el=document.createElement('div');el.className=cls;el.setAttribute('role','menu');el.innerHTML=html;body.append(el);const b=buttonEl.getBoundingClientRect();const rect=el.getBoundingClientRect();el.style.left=`${Math.max(16,Math.min(innerWidth-rect.width-16,b.left))}px`;el.style.top=`${Math.max(16,Math.min(innerHeight-rect.height-16,b.bottom+8))}px`;menuOrigin=buttonEl;buttonEl.setAttribute('aria-expanded','true');el.querySelector('button')?.focus();return el}
function filterMenu(buttonEl){menuAt(buttonEl,Object.entries(labels).map(([v,label])=>button('choose-filter',`${label}<span class="count">${v==='all'?tasks.length:tasks.filter(t=>t.status===v).length}</span>`,`role="menuitemradio" aria-checked="${state.filter===v}" data-filter="${v}"`)).join(''),'filter-menu')}
function toggleComplete(id,force){const t=get(id);if(!t)return;const previous=t.status,completionBefore=t.completionBefore;t.completionBefore=previous;t.status=force|| (t.status==='done'?(t.priorStatus||'pending'):'done');if(previous!=='done')t.priorStatus=previous;if([6,8].includes(D.n))retainedRows.add(id);state.undo={id,previous,collection:t.collection,completionBefore};clearTimeout(state.undoTimer);undoEl.hidden=false;state.undoTimer=setTimeout(()=>{undoEl.hidden=true},5000);render();say(t.status==='done'?`已完成 ${t.title}`:`已重新打开 ${t.title}`)}
function undo(){if(!state.undo)return;get(state.undo.id).status=state.undo.previous;get(state.undo.id).completionBefore=state.undo.completionBefore;if(state.undo.collection)get(state.undo.id).collection=state.undo.collection;retainedRows.delete(state.undo.id);state.undo=null;clearTimeout(state.undoTimer);undoEl.hidden=true;render();say('已撤销完成状态')}
function runnerText(r){return r.phase==='idle'?'待命':r.phase==='queued'?'排队 · 本地演示':r.phase==='running'?`运行第 ${r.step}/3 步 · 本地演示`:r.phase==='paused'?`已暂停 · 保留第 ${r.step}/3 步`:r.phase==='failed'?'示例执行已暂停 · 请重试':`完成 · 3/3 步 · 本地演示`}
function updateRunnerControls(){const t=selectedRecord();if(!t)return;const r=state.runners.get(t.id)||{phase:'idle',step:0};const out=q('[data-runner-status]');if(out)out.textContent=runnerText(r);const p=q('.runner-progress span');if(p)p.style.width=`${r.step/3*100}%`;for(const a of ['run','stop','resume','retry']){const el=q(`[data-action=${a}]`);if(el)el.disabled=a==='run'?['running','queued','paused'].includes(r.phase):a==='stop'?!['queued','running'].includes(r.phase):a==='resume'?r.phase!=='paused':false}}
function tickRunner(id){const r=state.runners.get(id);if(!r||!['queued','running'].includes(r.phase))return;if(r.phase==='queued'){r.phase='running';r.step=1}else if(r.step<3)r.step++;else r.phase='done';say(runnerText(r));updateRunnerControls();if(r.phase!=='done')r.timer=setTimeout(()=>tickRunner(id),D.step);renderBranch()}
function run(id,mode='run'){const t=get(id);if(!t||t.children.length!==3)return;let r=state.runners.get(id)||{phase:'idle',step:0,timer:null};clearTimeout(r.timer);if(mode==='stop'){r.resumePhase=r.phase;r.phase='paused'}else if(mode==='fail'){r.phase='failed'}else if(mode==='resume'){r.phase=r.resumePhase==='queued'?'queued':'running';r.timer=setTimeout(()=>tickRunner(id),D.step)}else{r.phase='queued';r.step=0;r.timer=setTimeout(()=>tickRunner(id),D.n===4||D.n===5?250:300)}state.runners.set(id,r);updateRunnerControls();say(runnerText(r))}
function showVoice(){if(D.n===4){state.voiceExposed=true;body.classList.add('voice-exposed');q('[data-action=expose-voice]').setAttribute('aria-expanded','true')}}
function startCapture(context='new',target=null){if(state.capture.phase!=='idle')cancelCapture(false);showVoice();session++;state.capture={phase:'listening',context,target,session,project:'VP',horizon:'later',confirmation:false};body.dataset.capture='listening';renderCapture();say('Listening · 正在聆听本地示例')}
function refineCapture(){if(state.capture.phase!=='listening')return;state.capture.phase='refining';body.dataset.capture='refining';renderCapture();say('Refining · 整理中');const token=state.capture.session;captureTimer=setTimeout(()=>{if(state.capture.session!==token||state.capture.phase!=='refining')return;state.capture.phase='done';body.dataset.capture='done';if(state.capture.context==='record'){q('.record-sentence').textContent=D.utterance;tray.hidden=true}else renderCapture();say('Done · 已整理本地示例')},D.refine)}
function renderCapture(message=''){const c=state.capture;if(c.phase==='idle'){tray.hidden=true;return}tray.hidden=c.context==='record'&&c.phase==='done';let html=`<h2>${c.phase==='listening'?'Listening · 正在聆听':c.phase==='refining'?'Refining · 整理中':'Done · 三步预览'}</h2><p>${esc(D.utterance)}</p>`;if(c.phase==='done'&&c.context!=='record'){html+=`<ol data-preview-children>${D.children.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`;if(D.n===7)html+=`<label>加入项目 <select data-draft="project" aria-label="草稿项目">${['VP','AI','Personal'].map(p=>`<option ${c.project===p?'selected':''}>${p}</option>`).join('')}</select></label>`;if(D.n===8)html+=`<label>加入时间 <select data-draft="horizon" aria-label="草稿时间范围">${[['later','Later'],['week','Week']].map(([v,p])=>`<option value="${v}" ${c.horizon===v?'selected':''}>${p}</option>`).join('')}</select></label>`;if(c.confirmation)html+=`<div class="confirm"><p>替换已有的三步？</p>${button('confirm-replace','确认替换')}${button('keep-children','保留原步骤')}</div>`;else html+=`<div class="capture-actions">${button('add',c.context==='update'?'应用三步':{1:'加入收件箱',2:'加入清单',5:'收入今日',6:'加入余下清单',7:'加入项目',8:'留到稍后'}[D.n]||'加入待办')}${button('rerecord','重说')}</div>`}
if(message)html+=`<p>${esc(message)}</p>`;html+=`<div class="capture-actions">${c.phase==='listening'?button('finish-capture','结束语音'):''}${button('cancel-capture',c.phase==='done'?'放弃':'取消')}</div>`;tray.innerHTML=html;if(c.context==='record'){q('.record-sentence').textContent=c.phase==='listening'?D.utterance:'正在整理这一句'}positionTray()}
function positionTray(){if(tray.hidden)return;const acc=state.route==='record'?q('.record-accessory'):q('[data-accessory]');if(!acc)return;const rect=acc.getBoundingClientRect();if(rect.width&&rect.height)tray.style.bottom=`${innerHeight-rect.top+12}px`}
function applyCapture(confirmed=false){const c=state.capture;if(c.phase!=='done'||state.accepted.has(c.session)||c.context==='record')return;let t=c.context==='update'?get(c.target):null;if(c.context==='update'&&!t)return;if(t?.children.length&&!confirmed){c.confirmation=true;renderCapture();return}state.accepted.add(c.session);if(!t){t={id:`voice-${c.session}`,title:D.utterance.split('：')[0],status:'pending',children:[],notes:'由本地示例语音生成的三步计划。',project:c.project,horizon:c.horizon,collection:'today'};tasks.unshift(t)}t.children=D.children.map((title,i)=>({id:`${t.id}-child-${c.session}-${i}`,title,status:'pending',children:[],notes:`第 ${i+1}/3 步 · 本地示例`,project:t.project,horizon:t.horizon}));if(D.n===7)state.project=t.project;if(D.n===8)setHorizon(t.horizon);if(D.n===5&&c.context==='new')setCard('today');if(D.n===10&&c.context==='new')setStage('list');if(D.n===3){state.branch=true;setPocket(false)}if(state.filter!=='all'&&state.filter!=='pending')state.filter='pending';const id=t.id;cancelCapture(false);body.classList.add('commit-settling');setTimeout(()=>body.classList.remove('commit-settling'),280);render();openDetail(id);say('已加入一项待办，包含三步')}
function cancelCapture(announce=true){if(activePointer!==null)ignoreClick=true;clearTimeout(holdTimer);clearTimeout(captureTimer);captureTimer=null;activePointer=null;holdStarted=false;keyboardHeld=false;const selection=state.capture.pendingSelection;state.capture={phase:'idle'};body.dataset.capture='idle';tray.hidden=true;tray.innerHTML='';if(state.route==='record')q('.record-sentence').textContent='准备好时，轻触底部玻璃。';if(announce)say('已取消 · 未提交任何待办');if(selection)openDetail(selection)}
function setStage(scene){const returning=state.route==='record';if(state.capture.phase!=='idle')cancelCapture();closeMenu();q('.stage-fan')&&(q('.stage-fan').hidden=true);state.pocket=false;if(state.selected)closeDetail();state.route='todo';body.dataset.route='todo';workspace.hidden=false;q('.record-home').hidden=true;if(D.n===10){const list=scene==='list';q('.task-browser').hidden=!list;q('.sister-focus').hidden=list;q('.browser-disclosure').hidden=list;q('[data-action=fold]').setAttribute('aria-expanded','false')}if(returning&&state.savedSelection){const saved=state.savedSelection;state.savedSelection=null;openDetail(saved)}updateInert()}
function routeRecord(){state.savedSelection=state.selected;cancelCapture(false);if(state.selected)closeDetail();closeMenu();workspace.hidden=true;q('.record-home').hidden=false;state.route='record';body.dataset.route='record';q('.record-fan').hidden=true;q('.record-sentence').textContent='准备好时，轻触底部玻璃。';q('[data-action=home-fold]').focus();say('录音')}
function openSettings(){if(state.capture.phase!=='idle')cancelCapture(false);restoreSettings=document.activeElement;q('.settings').hidden=false;updateInert();q('[data-action=close-settings]').focus()}
function closeSettings(){q('.settings').hidden=true;updateInert();restoreSettings?.focus()}
function captureTarget(action){return action==='home-voice'?'record':'new'}
function voiceToggle(action){if(state.capture.phase==='listening')refineCapture();else if(state.capture.phase==='idle'||state.capture.phase==='done')startCapture(captureTarget(action))}
qa('.voice').forEach(el=>{
 el.addEventListener('pointerdown',e=>{if(e.button!==0)return;ignoreClick=false;holdStarted=false;activePointer=e.pointerId;el.setPointerCapture(e.pointerId);holdTimer=setTimeout(()=>{if(activePointer!==e.pointerId)return;holdStarted=true;if(state.capture.phase==='listening')return;startCapture(captureTarget(el.dataset.action))},D.hold)});
 el.addEventListener('pointerup',e=>{clearTimeout(holdTimer);if(activePointer===e.pointerId&&!el.hasPointerCapture(e.pointerId)){ignoreClick=true;cancelCapture();return}const held=holdStarted;activePointer=null;holdStarted=false;if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);if(held){ignoreClick=true;refineCapture()}});
 el.addEventListener('pointercancel',()=>{ignoreClick=true;cancelCapture()});
 el.addEventListener('lostpointercapture',()=>{if(activePointer!==null){ignoreClick=true;cancelCapture()}});
 el.addEventListener('click',()=>{if(ignoreClick){ignoreClick=false;return}voiceToggle(el.dataset.action)});
 el.addEventListener('keydown',e=>{if(![' ','Enter'].includes(e.key))return;e.preventDefault();if(e.repeat)return;if(e.key==='Enter'){voiceToggle(el.dataset.action);return}keyboardHeld=true;if(state.capture.phase!=='listening')startCapture(captureTarget(el.dataset.action))});
 el.addEventListener('keyup',e=>{if(e.key===' '){e.preventDefault();if(keyboardHeld){keyboardHeld=false;refineCapture()}}});
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='voice'||a==='home-voice')return;
 if(a==='complete'){e.stopPropagation();toggleComplete(id)}
 else if(a==='select')openDetail(id,b);
 else if(a==='select-hero'){if(D.n===5&&state.card!=='focus')setCard('focus');else openDetail('focus',b)}
 else if(a==='close')closeDetail();
 else if(a==='expand-detail'){state.expanded=!state.expanded;detail.classList.toggle('expanded',state.expanded);b.setAttribute('aria-expanded',String(state.expanded));b.textContent=state.expanded?'收起详情':'展开详情'}
 else if(a==='tab'){state.tab=b.dataset.tab;renderDetail();q(`[data-tab=${state.tab}]`).focus()}
 else if(a==='filter'||a==='lens-menu')filterMenu(b);
 else if(a==='choose-filter'){const origin=menuOrigin;setFilter(b.dataset.filter);origin?.focus({preventScroll:true})}
 else if(a==='status')setFilter(b.dataset.status);
 else if(a==='clear-filter')setFilter(D.n===4?'pending':'all');
 else if(a==='undo')undo();
 else if(a==='reopen'||a==='complete-parent')toggleComplete(id,a==='reopen'?get(id).completionBefore:'done');
 else if(a==='fold'){if(D.n===10){state.pocket=!state.pocket;q('.stage-fan').hidden=!state.pocket;b.setAttribute('aria-expanded',String(state.pocket))}else setPocket(!state.pocket)}
 else if(a==='branch'){state.branch=!state.branch;if(!state.branch){setPocket(false);if(state.selected)closeDetail()}renderBranch()}
 else if(a==='hero-runner'){openDetail('focus',b);state.tab='runner';renderDetail()}
 else if(a==='expose-voice'){state.voiceExposed=!state.voiceExposed;body.classList.toggle('voice-exposed',state.voiceExposed);b.setAttribute('aria-expanded',String(state.voiceExposed));if(!state.voiceExposed)cancelCapture()}
 else if(a==='card')setCard(state.card===b.dataset.card?'focus':b.dataset.card);
 else if(a==='collapse-deck'){if(state.selected)closeDetail();else setCard('focus')}
 else if(a==='index'){const el=q('.margin-index');if(innerWidth<960)body.append(el);el.hidden=!el.hidden;menuOrigin=b;b.setAttribute('aria-expanded',String(!el.hidden))}
 else if(a==='project'){state.project=b.dataset.project;renderLists()}
 else if(a==='horizon')setHorizon(state.horizon===b.dataset.horizon?null:b.dataset.horizon);
 else if(a==='mode')menuAt(b,button('choose-mode','晨间','role="menuitemradio" data-mode="morning" aria-checked="'+(state.mode==='morning')+'"')+button('choose-mode','晚间','role="menuitemradio" data-mode="evening" aria-checked="'+(state.mode==='evening')+'"'));
 else if(a==='choose-mode'){state.mode=b.dataset.mode;q('.briefing-mode').textContent=state.mode==='morning'?'晨间简报':'晚间简报';q('.briefing-summary').textContent=state.mode==='morning'?'先处理现在这一件':'收好今天，留住下一步';closeMenu();menuOrigin?.focus()}
 else if(a==='inspector-week'){closeDetail();setHorizon('week')}
 else if(a==='decompose'){const target=id||'focus';if(state.selected)closeDetail();startCapture('update',target)}
 else if(a==='finish-capture')refineCapture();
 else if(a==='cancel-capture')cancelCapture();
 else if(a==='rerecord'){const c=state.capture;startCapture(c.context,c.target)}
 else if(a==='add')applyCapture();
 else if(a==='confirm-replace')applyCapture(true);
 else if(a==='keep-children')cancelCapture();
 else if(a==='archive-task'){const t=get(id);if(t){state.undo={id,previous:t.status,collection:t.collection};t.collection='archive';clearTimeout(state.undoTimer);undoEl.hidden=false;state.undoTimer=setTimeout(()=>undoEl.hidden=true,5000);render();say('已收入口袋')}}
 else if(a==='confirm-focus'){const t=get(state.pendingFocus);if(t&&t!==hero){const previous={...hero,id:`prior-focus-${++session}`,horizon:'later'};const index=tasks.indexOf(t);if(index>=0)tasks.splice(index,1);tasks.push(previous);Object.assign(hero,{...t,id:'focus',horizon:'now'});state.selected='focus';state.pendingFocus=null;render();say('已确认选择新的当前焦点')}}
 else if(a==='cancel-focus'){state.pendingFocus=null;renderDetail()}
 else if(['run','stop','resume','retry'].includes(a))run(id,a);
 else if(a==='runner-menu')menuAt(b,button('runner-fail','示例阻塞 / 模拟失败',`data-id="${id}" role="menuitem"`));
 else if(a==='runner-fail'){closeMenu();run(id,'fail')}
 else if(a==='browser'||a==='list-stage')setStage('list');
 else if(a==='focus-stage')setStage('focus');
 else if(a==='record')routeRecord();
 else if(a==='home-fold'){q('.record-fan').hidden=!q('.record-fan').hidden;b.setAttribute('aria-expanded',String(!q('.record-fan').hidden))}
 else if(a==='settings')openSettings();
 else if(a==='close-settings')closeSettings();
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.draft){state.capture[el.dataset.draft]=el.value;return}if(el.dataset.assignment){const t=selectedRecord();if(!t)return;const key=el.dataset.assignment;if(D.n===8&&el.value==='now'&&t.id!=='focus'){el.value=t.horizon;state.pendingFocus=t.id;const p=q('.detail-panel');p.querySelector('[data-focus-confirm]')?.remove();p.insertAdjacentHTML('beforeend',`<div data-focus-confirm><p>将这一项设为当前焦点？原焦点会留到稍后。</p>${button('confirm-focus','确认选择焦点')}${button('cancel-focus','取消')}</div>`);return}t[key]=el.value;renderLists();say(`已移至 ${el.options[el.selectedIndex].text}`)}});
document.addEventListener('keydown',e=>{
 const editing=e.target.matches('input,textarea,select,[contenteditable=true]');
 if(e.key==='Escape'){e.preventDefault();if(q('.settings:not([hidden])'))closeSettings();else if(q('.filter-menu,.context-menu')||(D.n===6&&innerWidth<960&&!q('.margin-index').hidden)){closeMenu();menuOrigin?.focus()}else if(state.capture.phase!=='idle'||activePointer!==null)cancelCapture();else if(state.selected)closeDetail();else if(D.n===5&&state.card!=='focus')setCard('focus');else if(D.n===10&&!q('.stage-fan').hidden){q('.stage-fan').hidden=true;state.pocket=false;q('[data-action=fold]').setAttribute('aria-expanded','false')}return}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!editing){e.preventDefault();undo();return}
 if(!editing&&!e.metaKey&&!e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();showVoice();(state.route==='record'?q('[data-action=home-voice]'):q('[data-action=voice]')).focus();return}
 if(!editing&&e.key.toLowerCase()==='r'&&state.selected){state.tab='runner';renderDetail();q('[data-action=run]')?.focus();return}
 const menu=e.target.closest('.filter-menu,.context-menu,.detail-tabs,.lens,.project-tabs,.deck-tabs,.margin-index');
 if(menu&&['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const buttons=[...menu.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);let next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)+buttons.length)%buttons.length;buttons[next].focus();if(menu.classList.contains('detail-tabs'))buttons[next].click()}
 if(D.n===3&&e.target.closest('.branch')&&['ArrowDown','ArrowUp'].includes(e.key)){const buttons=qa('.branch .task-body'),i=buttons.indexOf(e.target);e.preventDefault();buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()}
 if(e.key==='Tab'){const modal=!q('.settings').hidden?q('.settings'):state.selected&&innerWidth<D.breakpoint?detail:null;if(modal){const candidates=[...modal.querySelectorAll('button:not(:disabled),select,[tabindex="0"]')].filter(el=>el.getClientRects().length&&!el.closest('[hidden]'));if(!tray.hidden&&modal===detail)candidates.push(...tray.querySelectorAll('button:not(:disabled),select'));const current=candidates.indexOf(document.activeElement);e.preventDefault();const next=current<0?(e.shiftKey?candidates.length-1:0):(current+(e.shiftKey?-1:1)+candidates.length)%candidates.length;candidates[next]?.focus()}}
});
function syncTheme(theme,platform){if(['light','dark'].includes(theme)){if(root.dataset.theme!==theme)root.dataset.theme=theme;if(body.dataset.theme!==theme)body.dataset.theme=theme}if(['mobile','macos','desktop'].includes(platform)){const p=platform==='desktop'?'macos':platform;if(root.dataset.platform!==p)root.dataset.platform=p;if(body.dataset.platform!==p)body.dataset.platform=p}}
const adaptType=()=>{body.classList.toggle('large-type',parseFloat(getComputedStyle(root).fontSize)>20);placeUndo()};
syncTheme(root.dataset.theme,root.dataset.platform);adaptType();
new MutationObserver(records=>{for(const r of records){if(r.attributeName==='data-theme')syncTheme(r.target.dataset.theme);if(r.attributeName==='data-platform')syncTheme(null,r.target.dataset.platform);if(r.attributeName==='style')adaptType()}}).observe(root,{attributes:true,attributeFilter:['data-theme','data-platform','style']});
new MutationObserver(records=>{for(const r of records){if(r.attributeName==='data-theme')syncTheme(body.dataset.theme);if(r.attributeName==='data-platform')syncTheme(null,body.dataset.platform)}}).observe(body,{attributes:true,attributeFilter:['data-theme','data-platform']});
window.addEventListener('message',e=>{if(e.source!==parent||parent===window)return;const fileParent=location.protocol==='file:'&&e.origin==='null';if(e.origin!==location.origin&&!fileParent)return;const d=e.data;if(!d||typeof d!=='object'||Array.isArray(d))return;syncTheme(d.theme,d.platform)});
window.addEventListener('resize',()=>{adaptType();if(!new URLSearchParams(location.search).has('platform'))syncTheme(null,innerWidth>=D.breakpoint?'macos':'mobile');updateInert();positionTray();if(D.n===9)q('.inspector-empty').hidden=!!state.selected||innerWidth<900});
window.addEventListener('blur',()=>{if(state.capture.phase!=='idle')cancelCapture()});
window.addEventListener('pagehide',()=>{cancelCapture(false);clearTimeout(state.undoTimer);state.runners.forEach(r=>clearTimeout(r.timer))});
if(D.n===5)setCard('focus');if(D.n===8)setHorizon(null);render();if(D.n===9)openDetail('focus');
})();

</script></body></html>
