<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const app = document.querySelector('.hfs-app');
  const todoScreen = document.querySelector('.hfs-todo-screen');
  const recorderScreen = document.querySelector('.hfs-recorder-screen');
  const heroBank = document.querySelector('.hfs-hero-stage');
  const tray = document.querySelector('.hfs-secondary-tray');
  const trayBank = document.querySelector('.hfs-tray-bank');
  const switchButton = document.querySelector('.hfs-slide-btn');

  const state = {page: 'todo_list', expandedId: 'demo-01', rememberedId: 'demo-01', nextOrdinal: 7, capture: null, trayScroll: 0, initiator: null};
  const records = new Map();
  const views = new Map();
  const textNodes = new WeakMap();
  function text(element, value) {
    let node = textNodes.get(element);
    if (!node) { node = document.createTextNode(''); element.append(node); textNodes.set(element, node); }
    node.data = String(value);
    return element;
  }
  function node(tag, className, value) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (value !== undefined) text(element, value);
    return element;
  }
  function icon(name) {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'hfs-icon'); svg.setAttribute('aria-hidden', 'true');
    if (name === 'child' || name === 'status') {
      svg.setAttribute('viewBox', '0 0 24 24');
      const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('cx', '12'); ring.setAttribute('cy', '12'); ring.setAttribute('r', '9'); svg.append(ring);
      if (name === 'status') {
        const progress = document.createElementNS(NS, 'path'); progress.setAttribute('class', 'hfs-state-progress'); progress.setAttribute('d', 'M12 3a9 9 0 0 1 9 9'); progress.setAttribute('stroke-width', '4'); svg.append(progress);
      }

    } else {
      const use = document.createElementNS(NS, 'use'); use.setAttribute('href', '#hfs-' + name); svg.append(use);
    }
    return svg;
  }
  function button(className, label, iconName, action) {
    const element = node('button', className); element.type = 'button';
    if (iconName) element.append(icon(iconName));
    const labelSlot = node('span', 'hfs-button-label', label); element.append(labelSlot);
    element.addEventListener('click', action);
    return {element, label: labelSlot};
  }
  const live = document.querySelector('.hfs-live-region'); text(live, '');
  const micLabel = document.querySelector('.hfs-mic-label');
  textNodes.set(micLabel, micLabel.firstChild);
  const pageHeading = document.querySelector('.hfs-top-bar'); textNodes.set(pageHeading, pageHeading.firstChild);
  function announce(message) { text(live, message); }
  function notify(record, message) { record.feedback = message; text(views.get(record.id).feedback, message); announce(message); }
  function makeRecord(id, status, priority, title, tags, time, children) {
    return {id, status, priority, title, tags, time, subtasks: children.map((title, index) => ({id: id + '-s' + String(index + 1).padStart(2, '0'), title, checked: false})), feedback: '', undo: null, undoTimer: null, exportRevision: 0};
  }
  const fixtures = [
    makeRecord('demo-01', 'todo', 'P0', '整理星桥样稿的反馈', ['#VoxPocket', '#AI'], '今天 18:00', ['收集三条反馈', '按主题归类', '写一段结论']),
    makeRecord('demo-02', 'inprogress', 'P1', '校对云湾目录', ['#AI', '#iOS'], '今天 20:00', ['对照章节标题', '核对页码', '标出错字']),
    makeRecord('demo-03', 'todo', 'P1', '准备纸舟导览', ['#iOS'], '明天 10:00', ['选出三件展品', '写简短介绍', '排好导览顺序']),
    makeRecord('demo-04', 'done', 'P2', '归档风铃色板', ['#AI'], '昨天 16:00', ['整理示例色值', '检查命名', '保存色板清单']),
    makeRecord('demo-05', 'todo', 'P2', '汇总月砂提纲', ['#VoxPocket'], '本周五 14:00', ['通读提纲', '合并重复点', '写一句摘要']),
